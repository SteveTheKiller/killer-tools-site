name: Update tool popularity

on:
  schedule:
    # Every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Fetch popularity data from Umami
        env:
          UMAMI_URL: ${{ secrets.UMAMI_URL }}
          UMAMI_WEBSITE: ${{ secrets.UMAMI_WEBSITE }}
          UMAMI_USER: ${{ secrets.UMAMI_USER }}
          UMAMI_PASS: ${{ secrets.UMAMI_PASS }}
          UMAMI_DAYS: '90'
        run: node scripts/update-popularity.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/tool-popularity.json
          git diff --cached --quiet || git commit -m "chore: update tool popularity data"
          git push
