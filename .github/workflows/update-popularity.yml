name: Update tool popularity

on:
  schedule:
    - cron: '15 2 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:

jobs:
  update:
    runs-on: self-hosted
    permissions:
      actions: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch popularity data from Umami
        env:
          UMAMI_URL: http://localhost:3000
          UMAMI_WEBSITE: ${{ secrets.UMAMI_WEBSITE }}
          UMAMI_USER: ${{ secrets.UMAMI_USER }}
          UMAMI_PASS: ${{ secrets.UMAMI_PASS }}
          UMAMI_DAYS: '90'
        run: node scripts/update-popularity.mjs

      - name: Commit if changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/tool-popularity.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update tool popularity data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy updated popularity
        if: steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main'
            });
