about:
  content: |
    # À propos de killer-tools
    Ce merveilleux site, fait avec ❤ par [Steve the Killer](https://thekiller.net), regroupe des outils utiles pour les développeurs et les personnes travaillant dans l'informatique. Si vous le trouvez utile, n'hésitez pas à le partager et n'oubliez pas de le mettre dans vos favoris !
    killer-tools est open-source (sous licence GPL-3.0) et gratuit, et le restera toujours, mais cela me coûte de l'argent pour l'héberger et renouveler le nom de domaine. Si vous voulez soutenir mon travail, et m'encourager à ajouter plus d'outils, n'hésitez pas à me [soutenir](https://www.buymeacoffee.com/StevetheKiller).
    ## Technologies
    killer-tools est fait en Vue.js (Vue 3) avec la bibliothèque de composants Naive UI et est hébergé et déployé en continu par GitHub. Des bibliothèques open-source tierces sont utilisées dans certains outils, vous pouvez trouver la liste complète dans le fichier [package.json](https://github.com/SteveTheKiller/killer-tools-site/blob/main/package.json) du dépôt.
    ## Vous avez trouvé un bug ? Un outil manque ?
    Si vous avez besoin d'un outil qui n'est pas encore présent ici, et que vous pensez qu'il peut être utile, vous êtes invité à soumettre une demande de fonctionnalité dans la [section issue](https://github.com/SteveTheKiller/killer-tools-site/issues/new/choose) du dépôt GitHub.
