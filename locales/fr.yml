          description: Basculez entre vos tenants Microsoft 365 dans PowerShell sans lancer de commandes sur le mauvais. KillerPivot désactive le auth broker pour forcer une vraie invite de connexion, puis demande à la session dans quel tenant elle a réellement atterri et le vérifie avant que vous ne touchiez à quoi que ce soit. Enregistrez vos tenants une fois, puis basculez entre eux par nom, avec vérification d'identité intégrée.
          requirements: PowerShell 5.1 & 7 · ExchangeOnlineManagement v3+ · Microsoft.Graph.Authentication (pour -Graph)
        KillerScripts:
          description: Tous les outils du repo killer-scripts, disponibles comme commande dans n'importe quelle session PowerShell. Chaque script est récupéré directement depuis GitHub au moment de l'exécution, donc vous avez toujours la version actuelle, avec un cache local comme solution de secours hors ligne. Les 18 outils ont chacun leur propre commande et un alias court, donc taper urt lance le Universal Rename Tool.
          requirements: PowerShell 5.1 & 7 · Accès internet pour récupérer le script actuel (les copies en cache fonctionnent hors ligne)
