  privacy:
    heading: Politique de confidentialite
    lastUpdated: 'Dernière mise à jour : 4 avril 2026'
    overviewHeading: Apercu
    overviewIntro: KillerTools
    overviewBody: est une collection gratuite d'outils informatiques. Votre vie privée compte pour nous, et cette politique explique comment nous traitons vos données.
    dataCollectionHeading: Collecte de donnees
    dataCollectionBody: KillerTools ne collecte, ne stocke ni ne transmet aucune donnée personnelle. Tout le traitement des outils se fait entièrement dans votre navigateur. Aucune donnée que vous saisissez dans un outil n'est envoyée à un serveur.
    cookiesHeading: Cookies
    cookiesBody: Ce site n'utilise pas de cookies de suivi. Vos préférences de thème et vos paramètres sont stockés localement dans votre navigateur et ne sont jamais transmis.
    analyticsHeading: Statistiques
    analyticsIntro: Ce site utilise
    analyticsBody: un outil d'analyse respectueux de la vie privée, pour comprendre les tendances générales d'utilisation telles que les pages vues et les sources de référence. Umami n'utilise pas de cookies, ne suit pas les utilisateurs d'un site à l'autre et ne collecte aucune information personnelle identifiable. Toutes les données sont agrégées et anonymes.
    thirdPartyHeading: Services tiers
    thirdPartyBody: Certains outils peuvent renvoyer vers des ressources ou de la documentation externes. Nous ne sommes pas responsables des pratiques de confidentialité de ces sites externes.
    androidAppHeading: Application Android
    androidAppBody: L'application Android KillerTools est une enveloppe autour de l'application web. Elle ne demande ni n'accède à aucune permission de l'appareil au-delà de l'accès internet de base. Aucune donnée de l'appareil n'est collectée ni transmise.
    contactHeading: Contact
    contactBody: Si vous avez des questions sur cette politique de confidentialité, vous pouvez nous contacter à
  androidApp:
    robotAttribution: Le robot Android est reproduit ou modifié à partir d'un travail créé et partagé par Google, utilisé selon les termes de la licence Creative Commons 3.0 Attribution.
    heading: KillerTools pour Android
    introBody1: 'Toute la boîte à outils killertools.net en application Android native : chaque outil, la bibliothèque Killer Scripts et tous vos favoris, à un doigt de votre écran d''accueil.'
    introBody2: Mêmes règles que sur le site. Tout s'exécute sur votre appareil. Pas de compte, pas de télémétrie, pas d'envoi de données à distance. Si cela vous fait gagner un cycle de ticket sur le terrain, l'objectif est atteint.
    betaStatusPrefix: L'application est actuellement en
    betaStatusStrong: bêta fermée sur Google Play
    betaStatusSuffix: ', et c''est là que vous intervenez.'
    joinBetaHeading: Rejoindre la beta
    joinBetaIntroPrefix: Google exige
    joinBetaIntroStrong: 12 testeurs ayant l'application installée pendant 14 jours consécutifs
    joinBetaIntroSuffix: 'avant qu''une application d''un développeur indépendant puisse devenir publique. Trois étapes, environ deux minutes, et vous ferez partie des douze :'
    step1LinkText: Rejoindre le groupe de testeurs
    step1Suffix: sur Google Groups (cliquez sur "Join group").
    step2LinkText: Devenir testeur
    step2Suffix: sur la page d'inscription Google Play.
    step3LinkText: Installer l'application
    step3Suffix: depuis Google Play, et la garder installée pendant deux semaines.
    sameAccountStrong: Utilisez le même compte Google pour les trois étapes
    sameAccountSuffix: ' - la page d''inscription affiche "not available for this account" si vous sautez le groupe ou changez de compte.'
    feedbackPrefix: 'Quelque chose de cassé ou manquant ? Dites-le-moi :'
  home:
    sortPopular: Populaire
    sortAZ: A - Z
    sortZA: Z - A
  about:
    heading: A propos de KillerTools
    intro: Les techniciens de terrain n'ont pas de temps à perdre avec du superflu. Chaque outil ici existe parce que j'en avais besoin sur le terrain et que je ne trouvais rien qui fonctionne simplement, sans compte, sans installation ni télémétrie.
    originPrefix: Je construis maintenant des outils au sein de l'équipe d'ingénierie IA interne d'un MSP, après six ans de développement full-stack et huit ans comme technicien de terrain dans plusieurs entreprises. KillerTools.net a commencé comme un fork de l'excellent
    originMid: projet de
    originSuffix: et est devenu quelque chose de conçu pour le type de travail que je fais réellement. Je l'ai construit pour consulter des paramètres de Group Policy en plein ticket, scanner le sous-réseau d'un client et rechercher des références de ports sans quitter le navigateur.
    scriptsLibrary: La bibliothèque Killer Scripts couvre les tâches qui reviennent à chaque cycle de ticket. Chaque script fonctionne sous PS 5.1, PS 7 et Kaseya LiveConnect sans dépendances.
    privacyBody: Tout s'exécute dans votre navigateur. Rien n'est suivi. Aucun compte n'est jamais requis. Le site applique une Content Security Policy stricte pour bloquer les attaques par chaîne de dépendances. Si un paquet npm compromis venait à se retrouver dans le bundle, il ne pourrait pas renvoyer ce que vous avez collé.
    maintainedByPrefix: Cree et maintenu par
    maintainedByMid: Si cela vous fait gagner du temps au travail,
    buyMeCoffee: m'offrir un cafe
    maintainedBySuffix: est apprécié mais jamais attendu.
