    heading: Integritetspolicy
    lastUpdated: 'Senast uppdaterad: 4 april 2026'
    overviewHeading: Översikt
    overviewIntro: Killer Tools
    overviewBody: är en kostnadsfri samling IT-verktyg. Din integritet är viktig för oss, och den här policyn förklarar hur vi hanterar dina uppgifter.
    dataCollectionHeading: Datainsamling
    dataCollectionBody: Killer Tools samlar inte in, lagrar eller överför några personuppgifter. All bearbetning i verktygen sker helt i din webbläsare. Inga uppgifter som du anger i något verktyg skickas till någon server.
    cookiesHeading: Cookies
    cookiesBody: Den här webbplatsen använder inte cookies för spårning. Dina temaval och inställningar lagras lokalt i din webbläsare och överförs aldrig.
    analyticsHeading: Analys
    analyticsIntro: Den här webbplatsen använder
    analyticsBody: ett integritetsfokuserat analysverktyg, för att förstå allmänna användningsmönster som sidvisningar och hänvisningskällor. Umami använder inte cookies, spårar inte användare mellan webbplatser och samlar inte in någon personligt identifierbar information. All data är sammanställd och anonym.
    thirdPartyHeading: Tredjepartstjänster
    thirdPartyBody: Vissa verktyg kan länka till externa resurser eller dokumentation. Vi ansvarar inte för integritetspraxis på dessa externa webbplatser.
    androidAppHeading: Android-app
    androidAppBody: Android-appen Killer Tools är ett skal runt webbapplikationen. Den begär eller använder inga enhetsbehörigheter utöver grundläggande internetåtkomst. Ingen enhetsdata samlas in eller överförs.
    contactHeading: Kontakt
    contactBody: Om du har frågor om den här integritetspolicyn kan du nå oss på
