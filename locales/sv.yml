    description: KillerMCP kopplar AI-agenter till KillerTools-verktyg och Killer-appar som stöds. Välj den Cloudflare-hostade servern eller den installerade Windows-versionen.
    github: KillerMCP på GitHub
    eyebrow:
      agents: ETT NAMN / TVÅ SÄTT ATT ANSLUTA
      oneInstaller: INSTALLERAD PÅ WINDOWS
      hosted: HOSTAD PÅ CLOUDFLARE
      after: EFTER ANSLUTNING
    lead: Ge din agent användbara KillerTools-kommandon. Anslut till den publika Cloudflare-servern för webbsäkra verktyg, eller installera KillerMCP på Windows för lokala verktyg och Killer-appar som stöds.
    status: Välj den anslutning som passar de data och appar du vill använda.
    install: Installera
    intro: Windows-installationsprogrammet ger din agent en lokal anslutning till alla 81 KillerTools-verktyg och till kommandon som annonseras av Killer-appar som stöds och är installerade på datorn. Appkommandona beror på appens version och tillgänglighet. Ingen separat Node-installation eller källkodsutcheckning behövs.
    download: Ladda ner för Windows
    meta:
      version: Version {version}
      signed: Digitalt signerad
      hosted: Hostad på GitHub Releases
    steps:
      s1Title: Ladda ner och kör KillerMCP Setup.
      s1Body: Installationsprogrammet kontrollerar om .NET 10-körningsmiljön finns och öppnar Microsofts nedladdningssida om den saknas. Installationsprogrammet är signerat av Open Source Developer Stephen Riley och publiceras via GitHub Releases.
      s2Title: Låt installationsprogrammet ansluta din agent.
      s2Body: Det installerar den delade körningsmiljön och registrerar KillerMCP hos Codex, Claude Code, Claude Desktop, Cursor, GitHub Copilot, Gemini CLI och Windsurf när de hittas.
      s3Title: Öppna en ny agentchatt och fråga.
      s3Body: KillerMCP hittar tillgängliga KillerTools och installerade appkommandon via en enda anslutning.
    hostedTitle: Anslut utan installation
    hostedBody: Den publika Cloudflare-servern erbjuder 64 webbsäkra KillerTools-verktyg via en HTTP-anslutning. Den kan inte se dina Windows-filer eller installerade Killer-appar. De övriga 17 KillerTools-verktygen och alla kommandon för skrivbordsappar kräver installerad KillerMCP.
    actions:
      cursor: Lägg till i Cursor
      vscode: Lägg till i VS Code
      claude: Kopiera URL och öppna Claude
      codex: Kopiera installationskommando för Codex
      claudeCode: Kopiera installationskommando för Claude Code
      copyUrl: Kopiera URL
      copyCommand: Kopiera kommando
    otherClient: Använder du en annan MCP-klient? Kopiera server-URL:en.
    shortest: 'Den kortaste användbara prompten är {prompt}. Till exempel: {example}.'
    infer: Din agent kan härleda rätt KillerTools-verktyg eller Killer-app utifrån uppgiften och tillgängligt sammanhang. Använd {a}, {b}, {c} eller ett annat appnamn bara när du vill ange målet uttryckligen. Du behöver inga understreck, något operationsnamn eller något snedstreckskommando.
    worker:
      title: Så fungerar Cloudflare Worker
      p1: Den publika slutpunkten är en MCP-server med öppen källkod för strömmande HTTP som driftsätts separat från webbplatsen. Din MCP-klient skickar ett verktygsnamn och begränsade argument till {url}. Workern validerar begäran, kör det valda verktyget och returnerar resultatet.
      p2: De flesta beräkningar och konverteringar körs direkt i Workern. DNS-frågor använder Cloudflare DNS over HTTPS. Domänregistrering följer IANA:s RDAP-katalog. Sökningar efter CVE:er, GIF:ar och i katalogen kontaktar sina publika leverantörer och kan misslyckas när leverantörerna inte är tillgängliga eller begränsar antalet anrop.
    examples:
      title: Prova att fråga
      intro: Börja med {killer} och beskriv resultatet du vill ha. Namnet på appen eller verktyget är valfritt när uppgiften är tydlig.
      e1: domain search thekiller.net
      e2: beräkna 192.168.10.0/24
      e3: slå upp Windows-händelse 4625
      e4: undersök CVE-2025-53770
      e5: tolka de här e-posthuvudena
      e6: bygg ett PowerShell-kommando som listar stoppade tjänster
      e7: konvertera den här JSON-koden till CSV
      e8: jämför de här två JSON-dokumenten
      e9: generera en SPF-post för example.com
      e10: avkoda den här Base64-texten
      e11: identifiera den här M365-SKU:n
      e12: beräkna en exponering på 30 sekunder med det här ND-filtret
    apps:
      title: 'Integrationer med Killer-appar'
      intro: 'De här exemplen använder installerad KillerMCP och den Killer-app som stöds på din Windows-dator. Fråga med vanliga ord, så väljer din agent det tillgängliga kommandot.'
      killendarNote: 'För att skapa möten måste Killendar vara öppen och upplåst.'
      shortcut: 'Du kan inleda vilken som helst av de här promptarna med {killer} i stället för appnamnet. Ange appen bara när du vill rikta dig till den uttryckligen.'
      pdf1: killerpdf sammanfoga de här PDF-filerna i den här ordningen
      pdf2: killerpdf sök efter fakturanummer i den här PDF-filen
      pdf3: killer lägg till ett sökbart OCR-lager i den här PDF-filen
      pdf4: killer gör om den här KillerNotes-anteckningen till en PDF
      notes1: killernotes hitta mina anteckningar om kontorsnätverket
      notes2: killernotes skapa en anteckning med den här mötessammanfattningen
      notes3: killer lista mina anteckningar taggade med projects
      notes4: killer spara den här KillerScan-rapporten som en anteckning
      scan1: killerscan visa detaljer om mitt lokala nätverk
      scan2: killerscan skanna 192.168.1.0/24 efter enheter
      scan3: killer pinga example.com och visa paketförlust
      scan4: killer gör en PDF-rapport av den här nätverksskanningen
      shell1: killershell lista tjänsterna som körs på den här datorn
      shell2: killershell sök i C:\Docs efter filer som heter invoice
      shell3: killer visa de senaste posterna i programloggen
      shell4: killer spara den här kataloglistan som en PDF
      calendar1: killendar visa mina möten för i morgon
      calendar2: killendar skapa ett möte i morgon kl. 9 som heter Morgonmöte
      calendar3: killer visa min agenda för de kommande sju dagarna
      calendar4: killer spara nästa veckas agenda som en anteckning
      bench1: killerbench slå upp Windows-felkod 5
      bench2: killerbench kontrollera datorns hälsa utan att ändra något
      bench3: killerbench kör en skrivskyddad diagnostisk skanning
      bench4: killerbench visa resultatet av mitt diagnostiska jobb
      shot1: killershot lista mina skärmar
      shot2: killershot ta en skärmbild av min nuvarande skärm
      shot3: killershot visa mina senaste tagningar
      shot4: killershot läs texten i den här bilden
    twice:
      title: Varför {km} körs två gånger
      body: Claude Desktop startar varje lokal MCP-server två gånger. En kopia betjänar appens egna chattar och den andra betjänar Claude-sessioner som använder datorn på distans. Det är normalt att se två KillerMCP.exe-processer under Claude i Aktivitetshanteraren. KillerMCP är inte installerat två gånger, och ingenting behöver åtgärdas.
    can:
      title: Vad kan den göra?
      intro: 'Fråga med vanliga ord. Din agent hittar de tillgängliga verktygen och deras indata och anropar sedan dem den behöver. Den kan till exempel:'
      i1: Beräkna IPv4-subnät, expandera adressintervall, generera IPv6 ULA-prefix och slå upp MAC-tillverkare.
      i2: Kontrollera DNS-poster och domänregistrering, söka efter CVE:er och identifiera portar och protokoll.
      i3: Tolka e-posthuvuden, generera SPF- eller DMARC-poster och slå upp Exchange NDR-meddelanden.
      i4: Hitta felkoder och händelse-ID:n i Windows, grupprinciper och M365-licens-SKU:er.
      i5: Söka efter PowerShell-cmdletar och sätta ihop kommandon som du granskar innan de körs.
      i6: Formatera JSON och XML, konvertera JSON till CSV eller mellan JSON, YAML och TOML, avkoda Base64, jämföra dokument och testa reguljära uttryck.
      i7: Generera QR-koder, UUID:er, metataggar och platshållare, eller räkna på fotoexponering och film.
      i8: Konvertera skiftläge, datum, tider, temperaturer, färger, talbaser, romerska siffror, binär text, NATO-stavning och telefonformat.
      i9: Formatera SQL, YAML, TOML, Markdown, HTML-entiteter och strukturerad data, eller beräkna procent, cron-scheman och chmod-värden.
      i10: Söka efter emojier, GIF:ar, KillerScripts och Killer-moduler, eller granska URL:er, user agents, HTTP-statuskoder och textstatistik.
    cov:
      title: Vilken anslutning gör vad?
      hostedTitle: Cloudflare-server
      hostedBody: 64 webbsäkra verktyg med 74 operationer. Körs på distans via HTTP och behöver ingen installation. Har inte åtkomst till lokala appar eller filer.
      installedTitle: Windows-installation
      installedBody: Alla 81 KillerTools-verktyg med 94 operationer, plus kommandon från installerade Killer-appar som stöds. Körs som en lokal MCP-anslutning.
      browserTitle: Webbläsarkompanjoner
      browserBody: Verktygen för kamera, enhet, redigerare och signatur öppnar en privat localhost-sida.
    data:
      title: Vart tar data vägen?
      p1: Den installerade KillerMCP-körningsmiljön körs på din dator. Vissa nätverks- och referensuppslag kontaktar ändå sina publika datakällor. Din agent tar emot de indata och resultat som behövs för att slutföra begäran.
      p2: Den valfria hostade anslutningen skickar verktygens indata till KillerTools Cloudflare Worker. Den har ingen inloggning, begränsar begärandekroppar till 64 KiB, tillämpar begränsade scheman och begränsar antalet anrop per anslutande IP-adress. Skicka inte lösenord, privata filer, tokens eller kunddata via den hostade anslutningen.
      p3: Verktyg för lokala filer, webbläsare, lösenord, tokens, kryptering, hashning, OTP, BIP39 och nyckelgenerering hålls borta från den publika Workern. De körs via installerad KillerMCP, men MCP-klienten och modellleverantören kan ändå ta emot indata och resultat.
    oss:
      title: Öppen källkod och nuvarande begränsningar
      p1: '{kt} innehåller den publika Workern, det lokala KillerTools-paketet, operationskartan, valideringsscheman och täckningskontroller. {km} innehåller den delade lokala värden, adaptrar för skrivbordsappar, installationsprogrammet och integrationskontroller.'
      ktLink: KillerTools källkod
      kmLink: KillerMCP källkod
      p2: Resultat från externa uppslag beror på sina källor. Lokala verktyg tar bara emot sökvägar eller värden som anges i ett verktygsanrop. Avkodning av Base64-filer skapar en ny fil och vägrar skriva över en befintlig. Kamerafångst kräver fortfarande manuell behörighet i webbläsaren och verifiering av hårdvaran. Det nuvarande installationsprogrammet för KillerMCP är signerat, tidsstämplat och publicerat via GitHub Releases.
