  about:
    heading: Om Killer Tools
    intro: Fälttekniker har inte tid med onödigt krångel. Varje verktyg här finns för att jag behövde det i jobbet och inte hittade något som bara fungerade utan konto, installation eller telemetri.
    originPrefix: Numera bygger jag verktyg i en MSP:s interna AI-utvecklingsteam, efter sex år som fullstackutvecklare och åtta år som fälttekniker på flera olika företag. KillerTools.net började som en fork av det utmärkta projektet
    originMid: av
    originSuffix: och växte till något byggt för det arbete jag faktiskt gör. Jag byggde det för att slå upp grupprinciper mitt i ett ärende, skanna en kunds subnät och ta fram portreferenser utan att lämna webbläsaren.
    scriptsLibrary: Biblioteket Killer Scripts täcker de jobb som dyker upp i varje ärenderunda. Alla skript körs i PS 5.1, PS 7 och Kaseya LiveConnect utan beroenden.
    privacyBody: Allt körs i din webbläsare. Ingenting spåras. Inget konto krävs, aldrig. Webbplatsen tillämpar en strikt Content Security Policy för att blockera attacker via beroendekedjan. Om ett komprometterat npm-paket någon gång hamnar i paketet kan det inte skicka hem det du har klistrat in.
