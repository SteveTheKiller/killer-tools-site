about:
  content: |
    # killer-tools

    Fälttekniker har inte tid med onödigt krångel. Varje verktyg här finns för att jag behövde det i jobbet och inte hittade något som bara fungerade utan konto, installation eller telemetri.

    Jag är fälttekniker på en MSP och arbetar med nätverk, systemadministration och klientsupport. killer-tools började som en fork av det utmärkta projektet [IT-Tools](https://github.com/CorentinTh/it-tools) och växte till något byggt för det arbete jag faktiskt gör. Jag byggde det för att slå upp NDR-koder mitt i ett ärende, skanna en kunds subnät och avkoda en SafeLink innan jag klickar på den.

    Allt körs i din webbläsare. Ingenting spåras. Inget konto krävs, aldrig.

    Byggt och underhållet av [Steve the Killer](https://thekiller.net). Om det här sparar dig tid i jobbet uppskattas det om du [bjuder mig på en kaffe](https://www.buymeacoffee.com/StevetheKiller), men det förväntas aldrig.

    ## Saknar du ett verktyg? Hittat en bugg?

    Skapa en funktionsförfrågan eller felrapport under [issues](https://github.com/SteveTheKiller/killer-tools-site/issues/new/choose) på GitHub. Jag läser dem.
