about:
  content: |
    # killer-tools

    Saha teknisyenlerinin gereksiz şeylere ayıracak vakti yok. Buradaki her araç, işte ihtiyaç duyduğum ve hesap, kurulum ya da telemetri olmadan sadece çalışan bir şey bulamadığım için var.

    Bir MSP'de ağ, sistem yönetimi ve uç nokta desteğiyle ilgilenen bir saha teknisyeniyim. killer-tools, harika [IT-Tools](https://github.com/CorentinTh/it-tools) projesinin bir fork'u olarak başladı ve gerçekten yaptığım iş için tasarlanmış bir şeye dönüştü. Onu bir iş kaydının ortasında NDR kodlarına bakmak, bir müşterinin alt ağını taramak ve bir SafeLink'e tıklamadan önce çözmek için yaptım.

    Her şey tarayıcında çalışır. Hiçbir şey takip edilmez. Hiçbir zaman hesap gerekmez.

    [Steve the Killer](https://thekiller.net) tarafından yapıldı ve sürdürülüyor. İşte sana zaman kazandırıyorsa [bana bir kahve ısmarlamak](https://www.buymeacoffee.com/StevetheKiller) makbule geçer ama asla beklenmez.

    ## Bir araç mı eksik? Hata mı buldun?

    GitHub'daki [issues bölümünde](https://github.com/SteveTheKiller/killer-tools-site/issues/new/choose) bir özellik isteği veya hata raporu aç. Hepsini okuyorum.
