  privacy:
    heading: Gizlilik Politikası
    lastUpdated: 'Son güncelleme: 4 Nisan 2026'
    overviewHeading: Genel Bakış
    overviewIntro: Killer Tools
    overviewBody: ücretsiz bir BT yardımcı araçları koleksiyonudur. Gizliliğiniz bizim için önemlidir ve bu politika verilerinizi nasıl işlediğimizi açıklar.
    dataCollectionHeading: Veri Toplama
    dataCollectionBody: Killer Tools hiçbir kişisel veriyi toplamaz, saklamaz veya iletmez. Tüm araç işlemleri tamamen tarayıcınızda gerçekleşir. Herhangi bir araca girdiğiniz veriler hiçbir sunucuya gönderilmez.
    cookiesHeading: Çerezler
    cookiesBody: Bu site takip amacıyla çerez kullanmaz. Tema tercihleriniz ve ayarlarınız tarayıcınızda yerel olarak saklanır ve asla iletilmez.
    analyticsHeading: Analitik
    analyticsIntro: Bu site
    analyticsBody: sayfa görüntüleme ve yönlendirme kaynakları gibi genel kullanım eğilimlerini anlamak için gizlilik odaklı bir analitik aracı kullanır. Umami çerez kullanmaz, kullanıcıları siteler arasında takip etmez ve herhangi bir kişisel olarak tanımlanabilir bilgi toplamaz. Tüm veriler toplu ve anonimdir.
    thirdPartyHeading: Üçüncü Taraf Hizmetler
    thirdPartyBody: Bazı araçlar harici kaynaklara veya belgelere bağlantı verebilir. Bu harici sitelerin gizlilik uygulamalarından sorumlu değiliz.
    androidAppHeading: Android Uygulaması
    androidAppBody: Killer Tools Android uygulaması, web uygulamasının bir sarmalayıcısıdır. Temel internet erişimi dışında herhangi bir cihaz izni istemez veya kullanmaz. Hiçbir cihaz verisi toplanmaz veya iletilmez.
    contactHeading: İletişim
    contactBody: 'Bu gizlilik politikasıyla ilgili sorularınız varsa bize şu adresten ulaşabilirsiniz:'
  androidApp:
    robotAttribution: Android robotu, Google tarafından oluşturulup paylaşılan çalışmadan üretilmiş veya değiştirilmiştir ve Creative Commons 3.0 Attribution Lisansı'nda açıklanan koşullara göre kullanılmaktadır.
    heading: Android için Killer Tools
    introBody1: 'killertools.net araç kutusunun tamamı yerel bir Android uygulaması olarak: her araç, Killer Scripts kütüphanesi ve tüm favorileriniz, ana ekranınızdan tek dokunuşla.'
    introBody2: Sitedekiyle aynı kurallar. Her şey cihazınızda çalışır. Hesap yok, telemetri yok, eve telefon yok. Sahada bir bilet döngüsünden tasarruf ettiriyorsa görevini yapmış demektir.
    betaStatusPrefix: Uygulama şu anda
    betaStatusStrong: Google Play'de kapalı beta aşamasında
    betaStatusSuffix: ', ve burada devreye siz giriyorsunuz.'
    joinBetaHeading: Betaya katılın
    joinBetaIntroPrefix: Google, bağımsız bir geliştiricinin uygulamasının herkese açık hale gelebilmesi için
    joinBetaIntroStrong: uygulamayı 14 gün boyunca kesintisiz kurulu tutan 12 test kullanıcısı
    joinBetaIntroSuffix: 'şartını koyuyor. Üç adım, yaklaşık iki dakika ve o on ikiden biri siz olun:'
    step1LinkText: Test grubuna katıl
    step1Suffix: Google Groups üzerinde ("Join group" seçeneğine tıklayın).
    step2LinkText: Test kullanıcısı ol
    step2Suffix: Google Play katılım sayfasında.
    step3LinkText: Uygulamayı kur
    step3Suffix: Google Play'den ve iki hafta boyunca kurulu tut.
    sameAccountStrong: Üç adım için de aynı Google hesabını kullanın
    sameAccountSuffix: ' - grubu atlarsanız veya hesap değiştirirseniz katılım sayfası "bu hesap için kullanılamıyor" der.'
    feedbackPrefix: 'Bir şey bozuk mu veya eksik mi? Bana söyleyin:'
  home:
    sortPopular: Popüler
    sortAZ: A - Z
    sortZA: Z - A
  about:
    heading: Killer Tools Hakkında
    intro: Saha teknisyenlerinin gereksiz şeylere ayıracak vakti yok. Buradaki her araç, işte ihtiyacım olduğu ve hesap, kurulum veya telemetri gerektirmeden gerçekten çalışan bir şey bulamadığım için var.
    originPrefix: Şu anda bir MSP'nin dahili yapay zeka mühendisliği ekibinde araçlar geliştiriyorum; bundan önce altı yıl full-stack geliştirme ve birkaç şirkette sekiz yıl saha teknisyenliği yaptım. KillerTools.net, mükemmel bir
    originMid: projenin bir forku olarak başladı, bu projeyi yapan
    originSuffix: ', ve gerçekten yaptığım türden iş için tasarlanmış bir şeye dönüştü. Bileti çözerken Group Policy ayarlarına bakmak, bir müşterinin alt ağını taramak ve tarayıcıdan çıkmadan port referanslarına ulaşmak için oluşturdum.'
    scriptsLibrary: Killer Scripts kütüphanesi her bilet döngüsünde karşılaşılan işleri kapsar. Her betik, bağımlılık gerektirmeden PS 5.1, PS 7 ve Kaseya LiveConnect üzerinde çalışır.
    privacyBody: Her şey tarayıcınızda çalışır. Hiçbir şey izlenmez. Hiçbir zaman hesap gerekmez. Site, bağımlılık zinciri saldırılarını engellemek için sıkı bir İçerik Güvenliği Politikası uygular. Ele geçirilmiş bir npm paketi bir gün pakete karışsa bile, yapıştırdığınız veriyle eve telefon edemez.
