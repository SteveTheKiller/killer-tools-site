        KillerPivot:
          description: PowerShell'de Microsoft 365 kiracıları arasında, komutları yanlış kiracıya göndermeden geçiş yapın. KillerPivot, gerçek bir oturum açma isteği zorlamak için auth broker'ı devre dışı bırakır, ardından oturumun gerçekte hangi kiracıya bağlandığını sorar ve siz herhangi bir şeye dokunmadan önce bunu doğrular. Kiracılarınızı bir kez kaydedin, ardından yerleşik kimlik doğrulamayla aralarında isimle geçiş yapın.
          requirements: PowerShell 5.1 & 7 · ExchangeOnlineManagement v3+ · Microsoft.Graph.Authentication (-Graph için)
