          description: killer-scripts reposundaki her araç, herhangi bir PowerShell oturumunda komut olarak kullanılabilir. Her betik çalıştırıldığı anda doğrudan GitHub'dan çekilir, böylece her zaman güncel sürümde olursunuz; çevrimdışı yedek olarak yerel bir önbellek bulunur. 18 aracın tümünün kendi komutu ve kısa bir takma adı vardır, bu yüzden urt yazmak Universal Rename Tool'u çalıştırır.
          requirements: PowerShell 5.1 & 7 · Güncel betiği almak için internet erişimi gerekir (önbelleğe alınmış kopyalar çevrimdışı çalışır)
