    heading: অ্যান্ড্রয়েডের জন্য KillerTools
    introBody1: 'পুরো killertools.net টুলবক্স একটি নেটিভ অ্যান্ড্রয়েড অ্যাপ হিসেবে: প্রতিটি টুল, Killer Scripts লাইব্রেরি, এবং আপনার সব পছন্দের জিনিস, আপনার হোম স্ক্রিন থেকে এক ট্যাপ দূরে।'
    introBody2: সাইটের মতোই একই নিয়ম। সবকিছু আপনার ডিভাইসে চলে। কোনো অ্যাকাউন্ট নেই, কোনো টেলিমেট্রি নেই, ফোন-হোম নেই। মাঠে যদি এটি আপনার একটি টিকিট সাইকেল বাঁচায়, তাহলে এটি তার কাজ করেছে।
