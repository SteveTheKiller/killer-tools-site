  about:
    heading: KillerTools সম্পর্কে
    intro: ফিল্ড টেকদের ভারী কিছুর জন্য সময় নেই। এখানকার প্রতিটি টুল আছে কারণ কাজে আমার সেটার দরকার ছিল এবং এমন কিছু খুঁজে পাইনি যা অ্যাকাউন্ট, ইনস্টল বা টেলিমেট্রি ছাড়াই কাজ করে।
    originPrefix: আমি এখন একটি MSP-এর অভ্যন্তরীণ AI ইঞ্জিনিয়ারিং টিমে টুল তৈরি করি, ছয় বছরের ফুল-স্ট্যাক ডেভেলপমেন্ট এবং বিভিন্ন কোম্পানিতে আট বছরের ফিল্ড টেকনিশিয়ান অভিজ্ঞতার পর। KillerTools.net শুরু হয়েছিল চমৎকার
    originMid: প্রজেক্টের একটি ফর্ক হিসেবে, যা তৈরি করেছেন
    originSuffix: এবং এটি এমন কিছুতে পরিণত হয়েছে যা আমি আসলেই যে ধরনের কাজ করি তার জন্য তৈরি। আমি এটি তৈরি করেছি যাতে টিকিটের মাঝখানে Group Policy সেটিংস দেখা যায়, ক্লায়েন্টের সাবনেট স্ক্যান করা যায়, এবং ব্রাউজার না ছেড়ে পোর্ট রেফারেন্স বের করা যায়।
    scriptsLibrary: Killer Scripts লাইব্রেরি প্রতিটি টিকিট সাইকেলে আসা কাজগুলো কভার করে। প্রতিটি স্ক্রিপ্ট PS 5.1, PS 7, এবং Kaseya LiveConnect-এ কোনো নির্ভরতা ছাড়াই চলে।
    privacyBody: সবকিছু আপনার ব্রাউজারে চলে। কিছুই ট্র্যাক করা হয় না। কোনো অ্যাকাউন্ট কখনো প্রয়োজন হয় না। সাইটটি নির্ভরতা-চেইন আক্রমণ ব্লক করার জন্য একটি কঠোর Content Security Policy প্রয়োগ করে। একটি আপোসকৃত npm প্যাকেজ যদি কখনো বান্ডলে চলে আসে, এটি আপনার পেস্ট করা তথ্য নিয়ে ফোন-হোম করতে পারবে না।
