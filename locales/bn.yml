      s1Body: ইনস্টলারটি ওপেন সোর্স ডেভেলপার Stephen Riley দ্বারা স্বাক্ষরিত এবং GitHub Releases-এর মাধ্যমে প্রকাশিত।
      s2Title: সেটআপকে আপনার এজেন্ট সংযুক্ত করতে দিন।
      s2Body: এটি শেয়ার্ড রানটাইম ইনস্টল করে এবং পাওয়া গেলে Codex, Claude Code, Claude Desktop, Cursor, GitHub Copilot, Gemini CLI এবং Windsurf-এর সাথে KillerMCP নিবন্ধন করে।
      s3Title: একটি নতুন এজেন্ট চ্যাট খুলে জিজ্ঞাসা করুন।
      s3Body: KillerMCP একই সংযোগের মাধ্যমে সব ৮১টি KillerTools ইউটিলিটি উপলব্ধ করে।
    hostedBody: কিছু ইনস্টল করতে চান না? ৬৪টি ওয়েব-ভিত্তিক ইউটিলিটির জন্য সরাসরি হোস্টেড KillerTools সার্ভারে সংযুক্ত করুন। বাকি ১৭টি KillerTools ইউটিলিটি এবং সমস্ত ডেস্কটপ অ্যাপ টুলের জন্য ইনস্টল করা KillerMCP রানটাইম প্রয়োজন।
    actions:
      cursor: Cursor-এ যোগ করুন
      vscode: VS Code-এ যোগ করুন
      claude: URL কপি করুন এবং Claude খুলুন
      codex: Codex সেটআপ কমান্ড কপি করুন
      claudeCode: Claude Code সেটআপ কমান্ড কপি করুন
      copyUrl: URL কপি করুন
    otherClient: অন্য কোনো MCP ক্লায়েন্ট ব্যবহার করছেন? সার্ভার URL কপি করুন।
    shortest: 'সবচেয়ে সংক্ষিপ্ত কার্যকর প্রম্পট হলো {prompt}। উদাহরণস্বরূপ: {example}।'
    infer: আপনার এজেন্ট কাজ এবং উপলব্ধ প্রেক্ষাপট থেকে মিলিত KillerTools বা Killer অ্যাপ টুল অনুমান করতে পারে। লক্ষ্যটি স্পষ্টভাবে বোঝাতে চাইলে তবেই {a}, {b}, {c}, বা অন্য কোনো অ্যাপের নাম ব্যবহার করুন। আপনার আন্ডারস্কোর, অপারেশনের নাম, বা স্ল্যাশ কমান্ডের প্রয়োজন নেই।
    worker:
      title: Cloudflare Worker কীভাবে কাজ করে
      p1: পাবলিক এন্ডপয়েন্টটি একটি ওপেন-সোর্স স্ট্রিমেবল HTTP MCP সার্ভার, যা ওয়েবসাইট থেকে আলাদাভাবে ডিপ্লয় করা হয়েছে। আপনার MCP ক্লায়েন্ট একটি টুলের নাম এবং সীমাবদ্ধ আর্গুমেন্ট {url}-এ পাঠায়। Worker অনুরোধ যাচাই করে, নির্বাচিত ইউটিলিটি চালায়, এবং ফলাফল ফেরত দেয়।
      p2: বেশিরভাগ হিসাব এবং রূপান্তর সরাসরি Worker-এ চলে। DNS কোয়েরিগুলি Cloudflare DNS over HTTPS ব্যবহার করে। ডোমেইন নিবন্ধন IANA RDAP ডিরেক্টরি অনুসরণ করে। CVE, GIF, এবং ক্যাটালগ অনুসন্ধান তাদের পাবলিক প্রোভাইডারদের সাথে যোগাযোগ করে এবং সেই প্রোভাইডাররা অনুপলব্ধ বা রেট সীমিত থাকলে ব্যর্থ হতে পারে।
    examples:
      title: জিজ্ঞাসা করে দেখুন
      intro: '{killer} দিয়ে শুরু করুন এবং আপনি যে ফলাফল চান তা বর্ণনা করুন। কাজটি স্পষ্ট হলে অ্যাপ বা টুলের নাম ঐচ্ছিক।'
      e1: thekiller.net ডোমেইন খুঁজে দাও
      e2: 192.168.10.0/24 হিসাব করে দাও
      e3: Windows ইভেন্ট 4625 খুঁজে দাও
      e4: CVE-2025-53770 নিয়ে গবেষণা করো
      e5: এই ইমেইল হেডারগুলো পার্স করো
      e6: বন্ধ থাকা সার্ভিসগুলোর তালিকা করতে একটি PowerShell কমান্ড তৈরি করো
      e7: এই JSON-কে CSV-তে রূপান্তর করো
      e8: এই দুটি JSON ডকুমেন্ট তুলনা করো
      e9: example.com-এর জন্য একটি SPF রেকর্ড তৈরি করো
      e10: এই Base64 টেক্সট ডিকোড করো
      e11: এই M365 SKU শনাক্ত করো
      e12: এই ND ফিল্টার দিয়ে ৩০ সেকেন্ডের এক্সপোজার হিসাব করো
    can:
      title: এটি কী করতে পারে?
      intro: 'সাধারণ ভাষায় জিজ্ঞাসা করুন। আপনার এজেন্ট উপলব্ধ টুল এবং তাদের ইনপুট খুঁজে বের করে, তারপর যা প্রয়োজন তা কল করে। উদাহরণস্বরূপ, এটি পারে:'
      i1: IPv4 সাবনেট হিসাব করতে, ঠিকানার পরিসর সম্প্রসারিত করতে, IPv6 ULA প্রিফিক্স তৈরি করতে, এবং MAC ভেন্ডর খুঁজে বের করতে।
      i2: DNS রেকর্ড এবং ডোমেইন নিবন্ধন পরীক্ষা করতে, CVE খুঁজতে, এবং পোর্ট ও প্রোটোকল শনাক্ত করতে।
      i3: ইমেইল হেডার পার্স করতে, SPF বা DMARC রেকর্ড তৈরি করতে, এবং Exchange NDR বার্তা খুঁজে বের করতে।
      i4: Windows এরর ও ইভেন্ট আইডি, গ্রুপ পলিসি সেটিংস, এবং M365 লাইসেন্স SKU খুঁজে বের করতে।
      i5: PowerShell cmdlet খুঁজতে এবং চালানোর আগে আপনার পর্যালোচনার জন্য কমান্ড তৈরি করতে।
      i6: JSON এবং XML ফরম্যাট করতে, JSON থেকে CSV-তে বা JSON, YAML, এবং TOML-এর মধ্যে রূপান্তর করতে, Base64 ডিকোড করতে, ডকুমেন্ট তুলনা করতে, এবং রেগুলার এক্সপ্রেশন পরীক্ষা করতে।
      i7: QR কোড, UUID, মেটা ট্যাগ, এবং প্লেসহোল্ডার তৈরি করতে, বা ফটো এক্সপোজার ও ফিল্ম হিসাব করতে।
      i8: কেস, তারিখ, সময়, তাপমাত্রা, রং, নম্বর বেস, রোমান সংখ্যা, বাইনারি টেক্সট, NATO বানান, এবং ফোন ফরম্যাট রূপান্তর করতে।
      i9: SQL, YAML, TOML, Markdown, HTML এনটিটি, এবং স্ট্রাকচার্ড ডেটা ফরম্যাট করতে, বা শতাংশ, cron শিডিউল, এবং chmod মান হিসাব করতে।
      i10: ইমোজি, GIF, KillerScript, এবং Killer মডিউল খুঁজতে, বা URL, ইউজার এজেন্ট, HTTP স্ট্যাটাস কোড, এবং টেক্সট পরিসংখ্যান পরীক্ষা করতে।
    cov:
      title: হোস্টেড এবং স্থানীয় কভারেজ
      hostedTitle: হোস্টেড Worker
      hostedBody: ৭৪টি অপারেশন সহ ৬৪টি ব্রাউজার-নিরাপদ ইউটিলিটি। ইনস্টলেশনের প্রয়োজন নেই।
      installedTitle: ইনস্টল করা KillerMCP
      installedBody: ৯৪টি অপারেশন সহ সব ৮১টি KillerTools ইউটিলিটি, পাশাপাশি শনাক্ত করা Killer অ্যাপ।
      browserTitle: ব্রাউজার সহায়ক
      browserBody: ক্যামেরা, ডিভাইস, এডিটর, এবং সিগনেচার টুল একটি প্রাইভেট localhost পৃষ্ঠা খোলে।
    data:
      title: ডেটা কোথায় যায়?
      p1: ইনস্টল করা KillerMCP রানটাইম আপনার কম্পিউটারে চলে। কিছু নেটওয়ার্ক এবং রেফারেন্স অনুসন্ধান তাদের পাবলিক ডেটা উৎসের সাথে যোগাযোগ করে। আপনার এজেন্ট অনুরোধ সম্পূর্ণ করতে প্রয়োজনীয় ইনপুট এবং ফলাফল পায়।
      p2: ঐচ্ছিক হোস্টেড সংযোগ টুল ইনপুট KillerTools Cloudflare Worker-এ পাঠায়। এতে কোনো সাইন-ইন নেই, রিকোয়েস্ট বডি ৬৪ KiB-এ সীমিত, সীমাবদ্ধ স্কিমা প্রয়োগ করে, এবং প্রতিটি সংযুক্ত IP-এর হার সীমিত করে। হোস্টেড সংযোগের মাধ্যমে পাসওয়ার্ড, প্রাইভেট ফাইল, টোকেন, বা ক্লায়েন্ট ডেটা পাঠাবেন না।
      p3: স্থানীয় ফাইল, ব্রাউজার, পাসওয়ার্ড, টোকেন, এনক্রিপশন, হ্যাশিং, OTP, BIP39, এবং কী জেনারেশন টুল পাবলিক Worker থেকে দূরে থাকে। এগুলো ইনস্টল করা KillerMCP-এর মাধ্যমে চলে, তবে MCP ক্লায়েন্ট এবং মডেল প্রোভাইডার তবুও ইনপুট এবং ফলাফল পেতে পারে।
    oss:
      title: ওপেন সোর্স এবং বর্তমান সীমাবদ্ধতা
      p1: '{kt}-তে পাবলিক Worker, স্থানীয় KillerTools বান্ডল, অপারেশন ম্যাপ, ভ্যালিডেশন স্কিমা, এবং কভারেজ চেক অন্তর্ভুক্ত রয়েছে। {km}-তে শেয়ার্ড লোকাল হোস্ট, ডেস্কটপ অ্যাপ অ্যাডাপ্টার, ইনস্টলার, এবং ইন্টিগ্রেশন চেক অন্তর্ভুক্ত রয়েছে।'
      ktLink: KillerTools সোর্স
      kmLink: KillerMCP সোর্স
      p2: বাহ্যিক অনুসন্ধানের ফলাফল তাদের উৎসের ওপর নির্ভরশীল। স্থানীয় টুলগুলো শুধুমাত্র টুল কলে দেওয়া পাথ বা মান গ্রহণ করে। Base64 ফাইল ডিকোডিং একটি নতুন ফাইল তৈরি করে এবং বিদ্যমান ফাইল ওভাররাইট করতে অস্বীকার করে। ক্যামেরা ক্যাপচারের জন্য এখনও ম্যানুয়াল ব্রাউজার অনুমতি এবং হার্ডওয়্যার যাচাই প্রয়োজন। KillerMCP v0.1.1 স্বাক্ষরিত, টাইমস্ট্যাম্পযুক্ত, এবং GitHub Releases-এর মাধ্যমে প্রকাশিত।
