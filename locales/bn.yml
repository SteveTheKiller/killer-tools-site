about:
  content: |
    # killer-tools

    ফিল্ড টেকদের বাড়তি ঝামেলার জন্য সময় নেই। এখানকার প্রতিটি টুল আছে কারণ কাজের সময় আমার এটি দরকার হয়েছিল, আর অ্যাকাউন্ট, ইনস্টল বা টেলিমেট্রি ছাড়া সহজে কাজ করে এমন কিছু খুঁজে পাইনি।

    আমি একটি MSP-তে ফিল্ড টেক, নেটওয়ার্কিং, সিস্টেম অ্যাডমিনের কাজ এবং এন্ডপয়েন্ট সাপোর্ট সামলাই। killer-tools চমৎকার [IT-Tools](https://github.com/CorentinTh/it-tools) প্রকল্পের একটি ফর্ক হিসেবে শুরু হয়েছিল এবং আমি আসলে যে কাজ করি তার জন্য তৈরি কিছুতে পরিণত হয়েছে। টিকিটের মাঝখানে NDR কোড খুঁজতে, ক্লায়েন্টের সাবনেট স্ক্যান করতে এবং ক্লিক করার আগে একটি SafeLink ডিকোড করতে আমি এটি বানিয়েছিলাম।

    সবকিছু আপনার ব্রাউজারে চলে। কিছুই ট্র্যাক করা হয় না। কখনোই কোনো অ্যাকাউন্ট লাগে না।

    [Steve the Killer](https://thekiller.net) তৈরি ও রক্ষণাবেক্ষণ করেন। এটি যদি কাজে আপনার সময় বাঁচায়, তবে [আমাকে একটা কফি খাওয়ানো](https://www.buymeacoffee.com/StevetheKiller) প্রশংসনীয়, তবে কখনোই প্রত্যাশিত নয়।

    ## কোনো টুল নেই? বাগ পেয়েছেন?

    GitHub-এর [issues বিভাগে](https://github.com/SteveTheKiller/killer-tools-site/issues/new/choose) একটি ফিচার অনুরোধ বা বাগ রিপোর্ট খুলুন। আমি সেগুলো পড়ি।
