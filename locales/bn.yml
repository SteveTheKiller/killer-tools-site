    heading: গোপনীয়তা নীতি
    lastUpdated: 'সর্বশেষ আপডেট: এপ্রিল ৪, ২০২৬'
    overviewHeading: সংক্ষিপ্ত বিবরণ
    overviewIntro: KillerTools
    overviewBody: হলো IT ইউটিলিটি টুলের একটি বিনামূল্যের সংগ্রহ। আপনার গোপনীয়তা আমাদের কাছে গুরুত্বপূর্ণ, এবং এই নীতি ব্যাখ্যা করে যে আমরা আপনার ডেটা কীভাবে পরিচালনা করি।
    dataCollectionHeading: ডেটা সংগ্রহ
    dataCollectionBody: KillerTools কোনো ব্যক্তিগত ডেটা সংগ্রহ, সংরক্ষণ বা প্রেরণ করে না। সমস্ত টুল প্রসেসিং সম্পূর্ণভাবে আপনার ব্রাউজারে হয়। কোনো টুলে আপনি যে ডেটা প্রবেশ করান তা কোনো সার্ভারে পাঠানো হয় না।
    cookiesHeading: কুকিজ
    cookiesBody: এই সাইট ট্র্যাকিংয়ের জন্য কুকিজ ব্যবহার করে না। আপনার থিম পছন্দ এবং সেটিংস আপনার ব্রাউজারে স্থানীয়ভাবে সংরক্ষিত হয় এবং কখনো প্রেরণ করা হয় না।
    analyticsHeading: অ্যানালিটিক্স
    analyticsIntro: এই সাইট ব্যবহার করে
    analyticsBody: একটি গোপনীয়তা-কেন্দ্রিক অ্যানালিটিক্স টুল, পেজ ভিউ এবং রেফারেল উৎসের মতো সাধারণ ব্যবহারের প্যাটার্ন বোঝার জন্য। Umami কুকিজ ব্যবহার করে না, সাইট জুড়ে ব্যবহারকারীদের ট্র্যাক করে না, এবং কোনো ব্যক্তিগতভাবে শনাক্তযোগ্য তথ্য সংগ্রহ করে না। সমস্ত ডেটা সমষ্টিগত এবং বেনামী।
    thirdPartyHeading: তৃতীয় পক্ষের পরিষেবা
    thirdPartyBody: কিছু টুল বাহ্যিক সম্পদ বা ডকুমেন্টেশনের সাথে লিঙ্ক করতে পারে। সেই বাহ্যিক সাইটগুলোর গোপনীয়তা অনুশীলনের জন্য আমরা দায়ী নই।
    androidAppHeading: অ্যান্ড্রয়েড অ্যাপ
    androidAppBody: KillerTools অ্যান্ড্রয়েড অ্যাপটি ওয়েব অ্যাপ্লিকেশনের একটি র‌্যাপার। এটি মৌলিক ইন্টারনেট অ্যাক্সেসের বাইরে কোনো ডিভাইস অনুমতি অনুরোধ বা অ্যাক্সেস করে না। কোনো ডিভাইস ডেটা সংগ্রহ বা প্রেরণ করা হয় না।
    contactHeading: যোগাযোগ
    contactBody: এই গোপনীয়তা নীতি সম্পর্কে আপনার প্রশ্ন থাকলে, আপনি আমাদের সাথে যোগাযোগ করতে পারেন
