about:
  content: |
    # Sobre killer-tools
    Este maravilloso sitio web, hecho con ❤ por [Steve the Killer](https://thekiller.net) , agrega herramientas útiles para desarrolladores y personas que trabajan en IT. Si lo encuentra útil, no dude en compartirlo con las personas que crea que también pueden encontrarlo útil y ¡no olvide marcarlo como favorito en su barra de accesos directos!
    killer-tools es de código abierto (bajo la licencia GPL-3.0) y gratis, y siempre lo será, pero me cuesta dinero alojar y renovar el nombre de dominio. Si desea apoyar mi trabajo y animarme a agregar más herramientas, considere apoyarme a través de [patrocinarme](https://www.buymeacoffee.com/StevetheKiller).
    ## Tecnologías
    killer-tools está creado en Vue.js (Vue 3) con la biblioteca de componentes Naive UI y GitHub lo aloja y lo implementa continuamente. En algunas herramientas se utilizan bibliotecas de código abierto de terceros; puede encontrar la lista completa en [package.json](https://github.com/SteveTheKiller/killer-tools-site/blob/main/package.json) archivo del repositorio.
    ## ¿Encontraste un error? ¿Falta una herramienta?
    Si necesita una herramienta que actualmente no está presente aquí y cree que puede ser útil, puede enviar una solicitud de función en el [issues section](https://github.com/SteveTheKiller/killer-tools-site/issues/new/choose) en el repositorio de GitHub.
    Y si encontró un error o algo no funciona como se esperaba, presente un reporte de error en el [issues section](https://github.com/SteveTheKiller/killer-tools-site/issues/new/choose) en el repositorio de GitHub.
