  privacy:
    heading: Politica de privacidad
    lastUpdated: 'Última actualización: 4 de abril de 2026'
    overviewHeading: Resumen
    overviewIntro: KillerTools
    overviewBody: es una colección gratuita de herramientas de TI. Tu privacidad es importante para nosotros, y esta política explica cómo tratamos tus datos.
    dataCollectionHeading: Recopilacion de datos
    dataCollectionBody: KillerTools no recopila, almacena ni transmite ningún dato personal. Todo el procesamiento de las herramientas ocurre por completo en tu navegador. Ningún dato que introduzcas en una herramienta se envía a ningún servidor.
    cookiesHeading: Cookies
    cookiesBody: Este sitio no utiliza cookies de seguimiento. Tus preferencias de tema y ajustes se guardan localmente en tu navegador y nunca se transmiten.
    analyticsHeading: Analitica
    analyticsIntro: Este sitio utiliza
    analyticsBody: una herramienta de analítica centrada en la privacidad, para entender patrones generales de uso como visitas a páginas y fuentes de referencia. Umami no utiliza cookies, no rastrea usuarios entre sitios y no recopila ninguna información identificable. Todos los datos están agregados y son anónimos.
    thirdPartyHeading: Servicios de terceros
    thirdPartyBody: Algunas herramientas pueden enlazar a recursos o documentación externa. No somos responsables de las prácticas de privacidad de esos sitios externos.
    androidAppHeading: Aplicacion Android
    androidAppBody: La aplicación Android de KillerTools es un envoltorio de la aplicación web. No solicita ni accede a ningún permiso del dispositivo más allá del acceso básico a internet. No se recopila ni transmite ningún dato del dispositivo.
    contactHeading: Contacto
    contactBody: Si tienes preguntas sobre esta política de privacidad, puedes contactarnos en
  androidApp:
    robotAttribution: El robot de Android se reproduce o modifica a partir de un trabajo creado y compartido por Google, y se usa según los términos descritos en la Creative Commons 3.0 Attribution License.
    heading: KillerTools para Android
    introBody1: 'Toda la caja de herramientas de killertools.net como aplicación nativa de Android: cada herramienta, la biblioteca Killer Scripts y todos tus favoritos, a un toque desde tu pantalla de inicio.'
    introBody2: Las mismas reglas que en el sitio. Todo se ejecuta en tu dispositivo. Sin cuenta, sin telemetría, sin llamadas a casa. Si te ahorra un ciclo de ticket en el campo, ha cumplido su propósito.
    betaStatusPrefix: La aplicación está actualmente en
    betaStatusStrong: beta cerrada en Google Play
    betaStatusSuffix: ', y aquí es donde entras tú.'
    joinBetaHeading: Unete a la beta
    joinBetaIntroPrefix: Google exige
