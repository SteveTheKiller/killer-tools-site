  about:
    heading: Acerca de KillerTools
    intro: Los técnicos de campo no tienen tiempo para sobrecarga. Cada herramienta aquí existe porque la necesité en el trabajo y no encontré algo que simplemente funcionara sin cuenta, instalación ni telemetría.
    originPrefix: Ahora construyo herramientas en el equipo interno de ingenieria de IA de un MSP, tras seis años de desarrollo full-stack y ocho años como tecnico de campo en varias empresas. KillerTools.net empezo como un fork del excelente
    originMid: proyecto de
    originSuffix: y creció hasta convertirse en algo pensado para el tipo de trabajo que realmente hago. Lo construí para consultar ajustes de Group Policy en mitad de un ticket, escanear la subred de un cliente y buscar referencias de puertos sin salir del navegador.
    scriptsLibrary: La biblioteca Killer Scripts cubre las tareas que aparecen en cada ciclo de ticket. Cada script funciona desde la línea de comandos en PS 5.1, PS 7 y Kaseya LiveConnect, sin dependencias.
    privacyBody: Todo se ejecuta en tu navegador. Nada se rastrea. Nunca se requiere una cuenta. El sitio aplica una Content Security Policy estricta para bloquear ataques en la cadena de dependencias. Si un paquete npm comprometido llegara a colarse en el paquete final, no podría enviar a casa lo que hayas pegado.
    maintainedByPrefix: Creado y mantenido por
    maintainedByMid: Si esto te ahorra tiempo en el trabajo,
    buyMeCoffee: invitarme a un cafe
    maintainedBySuffix: se agradece pero nunca se espera.
    missingToolHeading: ¿Falta una herramienta? ¿Encontraste un error?
    issuesPrefix: Abre una solicitud de función o un informe de error en la
