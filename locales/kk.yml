    overviewBody: IT утилиталарының тегін жинағы болып табылады. Сіздің құпиялылығыңыз біз үшін маңызды, осы саясат деректеріңізді қалай өңдейтінімізді түсіндіреді.
    dataCollectionHeading: Деректерді жинау
    dataCollectionBody: Killer Tools ешқандай жеке деректерді жинамайды, сақтамайды немесе жібермейді. Барлық өңдеу толығымен сіздің браузеріңізде орындалады. Кез келген құралға енгізілген деректер серверге жіберілмейді.
    cookiesHeading: Cookie файлдары
    cookiesBody: Бұл сайт бақылау үшін cookie файлдарын пайдаланбайды. Тақырып параметрлеріңіз бен баптауларыңыз браузеріңізде жергілікті түрде сақталады және ешқашан жіберілмейді.
    analyticsHeading: Аналитика
    analyticsIntro: Бұл сайт
    analyticsBody: бет қаралымдары мен сілтеме көздері сияқты жалпы пайдалану үлгілерін түсіну үшін құпиялылыққа бағытталған аналитика құралын пайдаланады. Umami cookie файлдарын пайдаланбайды, пайдаланушыларды сайттар арасында бақыламайды және жеке басты анықтайтын ешқандай ақпаратты жинамайды. Барлық деректер жинақталған және анонимді.
    thirdPartyHeading: Үшінші тарап қызметтері
    thirdPartyBody: Кейбір құралдар сыртқы ресурстарға немесе құжаттамаға сілтеме бере алады. Біз сол сыртқы сайттардың құпиялылық тәжірибесіне жауап бермейміз.
    androidAppHeading: Android қосымшасы
    androidAppBody: Killer Tools Android қосымшасы веб-қолданбаны орайтын қабық болып табылады. Ол негізгі интернетке қол жеткізуден басқа құрылғы рұқсаттарын сұрамайды және пайдаланбайды. Ешқандай құрылғы деректері жиналмайды немесе жіберілмейді.
    contactHeading: Байланыс
    contactBody: 'Осы құпиялылық саясаты бойынша сұрақтарыңыз болса, бізге мына жерден хабарласа аласыз:'
