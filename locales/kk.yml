  about:
    heading: Killer Tools туралы
    intro: Далалық техниктердің артық нәрсеге уақыты жоқ. Мұндағы әрбір құрал жұмыста маған қажет болғандықтан және тіркелгісіз, орнатусыз немесе телеметриясыз жай ғана жұмыс істейтін нәрсе таба алмағандықтан бар болды.
    originPrefix: Қазір мен MSP-тің ішкі AI инженерия тобында құралдар жасаймын, алты жыл full-stack әзірлеу мен бірнеше компанияда сегіз жыл далалық техник болғаннан кейін. KillerTools.net тамаша
    originMid: жобасының форкы ретінде басталды, авторы
    originSuffix: және мен нақты атқаратын жұмыс түріне арналған нәрсеге айналды. Мен оны тапсырма үстінде Топтық саясат параметрлерін іздеу, клиенттің ішкі желісін сканерлеу және браузерден шықпай порт анықтамаларын алу үшін жасадым.
    scriptsLibrary: Killer Scripts кітапханасы әр тапсырма циклінде туындайтын жұмыстарды қамтиды. Әрбір скрипт PS 5.1, PS 7 және Kaseya LiveConnect ортасында тәуелділіксіз жұмыс істейді.
    privacyBody: Барлығы браузеріңізде орындалады. Ешнәрсе бақыланбайды. Тіркелгі ешқашан талап етілмейді. Сайт тәуелділік тізбегі шабуылдарын бөгеу үшін қатаң Content Security Policy қолданады. Егер бүлінген npm пакеті бумаға еніп кетсе, ол сіз қойған нәрсені сыртқа жібере алмайды.
