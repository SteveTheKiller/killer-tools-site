about:
  content: |
    # killer-tools

    Далалық техниктердің артық нәрсеге уақыты жоқ. Мұндағы әр құрал маған жұмыста қажет болғандықтан және тіркелгісіз, орнатусыз немесе телеметриясыз жай ғана жұмыс істейтін нәрсе таба алмағандықтан бар.

    Мен MSP компаниясында желілер, жүйелік әкімшілік және соңғы құрылғыларды қолдаумен айналысатын далалық техникпін. killer-tools тамаша [IT-Tools](https://github.com/CorentinTh/it-tools) жобасының форкы ретінде басталып, мен шынымен атқаратын жұмысқа арналған құралға айналды. Мен оны өтінім барысында NDR кодтарын іздеу, клиенттің ішкі желісін сканерлеу және SafeLink сілтемесін баспас бұрын шешу үшін жасадым.

    Барлығы браузеріңізде жұмыс істейді. Ештеңе бақыланбайды. Тіркелгі ешқашан қажет емес.

    [Steve the Killer](https://thekiller.net) жасаған және қолдайды. Егер бұл жұмыста уақытыңызды үнемдесе, [маған кофе сатып алу](https://www.buymeacoffee.com/StevetheKiller) қуантады, бірақ ешқашан міндетті емес.

    ## Құрал жетіспей ме? Қате таптыңыз ба?

    GitHub-тағы [issues бөлімінде](https://github.com/SteveTheKiller/killer-tools-site/issues/new/choose) мүмкіндік сұрауын немесе қате туралы есепті ашыңыз. Мен оларды оқимын.
