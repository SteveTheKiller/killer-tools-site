    heading: Политика конфиденциальности
    lastUpdated: 'Последнее обновление: 4 апреля 2026 г.'
    overviewHeading: Обзор
    overviewIntro: Killer Tools
    overviewBody: '- это бесплатный набор ИТ-утилит. Ваша конфиденциальность важна для нас, и эта политика объясняет, как мы обрабатываем ваши данные.'
    dataCollectionHeading: Сбор данных
    dataCollectionBody: Killer Tools не собирает, не хранит и не передает никаких персональных данных. Вся обработка происходит полностью в вашем браузере. Данные, введенные в любой инструмент, не отправляются на сервер.
    cookiesHeading: Файлы cookie
    cookiesBody: Этот сайт не использует файлы cookie для отслеживания. Настройки темы и параметры хранятся локально в вашем браузере и никогда не передаются.
    analyticsHeading: Аналитика
    analyticsIntro: Этот сайт использует
    analyticsBody: инструмент аналитики, ориентированный на конфиденциальность, чтобы понимать общие тенденции использования, такие как просмотры страниц и источники переходов. Umami не использует файлы cookie, не отслеживает пользователей на разных сайтах и не собирает никаких персональных данных. Все данные агрегированы и анонимны.
    thirdPartyHeading: Сторонние сервисы
    thirdPartyBody: Некоторые инструменты могут ссылаться на внешние ресурсы или документацию. Мы не несем ответственности за политику конфиденциальности этих внешних сайтов.
    androidAppHeading: Приложение для Android
    androidAppBody: Приложение Killer Tools для Android представляет собой оболочку веб-приложения. Оно не запрашивает и не использует никаких разрешений устройства, кроме базового доступа в интернет. Данные устройства не собираются и не передаются.
    contactHeading: Контакты
    contactBody: Если у вас есть вопросы об этой политике конфиденциальности, вы можете связаться с нами по адресу
