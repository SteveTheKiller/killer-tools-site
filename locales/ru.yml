  about:
    heading: О Killer Tools
    intro: У полевых техников нет времени на лишнее. Каждый инструмент здесь существует, потому что он понадобился мне на работе, а готового решения без аккаунта, установки или телеметрии я не нашел.
    originPrefix: Сейчас я разрабатываю инструменты во внутренней команде ИИ-инженеринга MSP, после шести лет full-stack разработки и восьми лет работы выездным техником в нескольких компаниях. KillerTools.net начался как форк отличного
    originMid: проекта от
    originSuffix: и превратился в нечто, созданное именно для той работы, которой я занимаюсь. Я сделал его, чтобы смотреть настройки групповой политики прямо во время заявки, сканировать подсеть клиента и искать справочник по портам, не покидая браузер.
    scriptsLibrary: Библиотека Killer Scripts закрывает задачи, которые встречаются в каждом цикле заявок. Каждый скрипт работает в PS 5.1, PS 7 и Kaseya LiveConnect без каких-либо зависимостей.
    privacyBody: Все работает в вашем браузере. Ничего не отслеживается. Аккаунт не требуется никогда. Сайт применяет строгую политику безопасности контента (CSP), блокирующую атаки через цепочку зависимостей. Если скомпрометированный npm-пакет когда-нибудь попадет в сборку, он не сможет отправить домой то, что вы вставили.
    maintainedByPrefix: Создано и поддерживается
    maintainedByMid: Если это экономит вам время на работе,
    buyMeCoffee: угостить меня кофе
    maintainedBySuffix: приветствуется, но никогда не ожидается.
