about:
  content: |
    # killer-tools

    У выездных инженеров нет времени на лишнее. Каждый инструмент здесь появился потому, что он был нужен мне в работе, а я не мог найти ничего, что просто работало бы без учётной записи, установки или телеметрии.

    Я выездной инженер в MSP и занимаюсь сетями, системным администрированием и поддержкой рабочих станций. killer-tools начинался как форк отличного проекта [IT-Tools](https://github.com/CorentinTh/it-tools) и вырос в инструмент для той работы, которую я действительно делаю. Я сделал его, чтобы посреди заявки находить коды NDR, сканировать подсеть клиента и расшифровывать SafeLink, прежде чем по нему кликнуть.

    Всё работает в вашем браузере. Ничего не отслеживается. Учётная запись не нужна, никогда.

    Создано и поддерживается [Steve the Killer](https://thekiller.net). Если это экономит вам время в работе, [угостить меня кофе](https://www.buymeacoffee.com/StevetheKiller) приятно, но никогда не обязательно.

    ## Не хватает инструмента? Нашли ошибку?

    Создайте запрос на функцию или сообщение об ошибке в [разделе issues](https://github.com/SteveTheKiller/killer-tools-site/issues/new/choose) на GitHub. Я их читаю.
