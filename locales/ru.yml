          description: Все инструменты из репозитория killer-scripts доступны как команда в любой сессии PowerShell. Каждый скрипт загружается напрямую с GitHub в момент запуска, поэтому у вас всегда актуальная версия, а локальный кэш служит запасным вариантом офлайн. У всех 18 инструментов есть своя команда и короткий алиас, поэтому urt запускает Universal Rename Tool.
          requirements: PowerShell 5.1 & 7 · Нужен доступ в интернет для загрузки текущего скрипта (кэшированные копии работают офлайн)
