  privacy:
    heading: Informativa sulla privacy
    lastUpdated: 'Ultimo aggiornamento: 4 aprile 2026'
    overviewHeading: Panoramica
    overviewIntro: Killer Tools
    overviewBody: è una raccolta gratuita di strumenti IT. La tua privacy è importante per noi, e questa informativa spiega come trattiamo i tuoi dati.
    dataCollectionHeading: Raccolta dati
    dataCollectionBody: Killer Tools non raccoglie, non memorizza e non trasmette alcun dato personale. Tutta l'elaborazione degli strumenti avviene interamente nel tuo browser. Nessun dato inserito in uno strumento viene inviato a un server.
    cookiesHeading: Cookie
    cookiesBody: Questo sito non utilizza cookie per il tracciamento. Le preferenze del tema e le impostazioni sono memorizzate localmente nel tuo browser e non vengono mai trasmesse.
    analyticsHeading: Analisi
    analyticsIntro: Questo sito utilizza
    analyticsBody: uno strumento di analisi rispettoso della privacy, per comprendere modelli generali di utilizzo come visualizzazioni di pagina e fonti di riferimento. Umami non utilizza cookie, non traccia gli utenti tra siti diversi e non raccoglie informazioni personali identificabili. Tutti i dati sono aggregati e anonimi.
    thirdPartyHeading: Servizi di terze parti
    thirdPartyBody: Alcuni strumenti possono rimandare a risorse o documentazione esterne. Non siamo responsabili delle pratiche sulla privacy di quei siti esterni.
    androidAppHeading: App Android
    androidAppBody: L'app Android di Killer Tools è un wrapper intorno all'applicazione web. Non richiede né accede ad alcun permesso del dispositivo oltre al normale accesso a internet. Nessun dato del dispositivo viene raccolto o trasmesso.
    contactHeading: Contatti
    contactBody: Se hai domande su questa informativa sulla privacy, puoi contattarci a
  androidApp:
    robotAttribution: Il robot Android è riprodotto o modificato da un'opera creata e condivisa da Google, utilizzata secondo i termini descritti nella licenza Creative Commons 3.0 Attribution.
    heading: Killer Tools per Android
    introBody1: 'L''intero toolbox di killertools.net come app nativa per Android: ogni strumento, la libreria Killer Scripts e tutti i tuoi preferiti, a un tocco dalla schermata home.'
    introBody2: Le stesse regole del sito. Tutto viene eseguito sul tuo dispositivo. Nessun account, nessuna telemetria, nessuna comunicazione nascosta. Se ti fa risparmiare un ciclo di ticket sul campo, ha fatto il suo lavoro.
