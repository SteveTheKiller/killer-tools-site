about:
  content: |
    # killer-tools

    I tecnici sul campo non hanno tempo per il superfluo. Ogni strumento qui esiste perché mi serviva sul lavoro e non trovavo nulla che funzionasse semplicemente, senza account, installazione o telemetria.

    Sono un tecnico sul campo in un MSP e mi occupo di reti, amministrazione di sistema e supporto agli endpoint. killer-tools è nato come fork dell'eccellente progetto [IT-Tools](https://github.com/CorentinTh/it-tools) ed è diventato qualcosa di pensato per il lavoro che faccio davvero. L'ho creato per cercare codici NDR nel mezzo di un ticket, scansionare la subnet di un cliente e decodificare un SafeLink prima di cliccarci sopra.

    Tutto funziona nel tuo browser. Nulla viene tracciato. Nessun account è richiesto, mai.

    Creato e mantenuto da [Steve the Killer](https://thekiller.net). Se ti fa risparmiare tempo sul lavoro, [offrirmi un caffè](https://www.buymeacoffee.com/StevetheKiller) è apprezzato ma mai dovuto.

    ## Manca uno strumento? Hai trovato un bug?

    Apri una richiesta di funzionalità o una segnalazione di bug nella [sezione issues](https://github.com/SteveTheKiller/killer-tools-site/issues/new/choose) su GitHub. Le leggo.
