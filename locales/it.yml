  about:
    heading: Informazioni su Killer Tools
    intro: I tecnici sul campo non hanno tempo per il superfluo. Ogni strumento qui esiste perché mi serviva sul lavoro e non riuscivo a trovare qualcosa che funzionasse senza un account, un'installazione o la telemetria.
    originPrefix: Ora costruisco strumenti nel team interno di ingegneria AI di un MSP, dopo sei anni di sviluppo full-stack e otto anni come tecnico sul campo in diverse aziende. KillerTools.net è nato come fork dell'eccellente
    originMid: progetto di
    originSuffix: ed è diventato qualcosa costruito per il tipo di lavoro che faccio davvero. L'ho creato per cercare le impostazioni dei Criteri di gruppo a metà ticket, scansionare la subnet di un cliente e recuperare i riferimenti alle porte senza uscire dal browser.
    scriptsLibrary: La libreria Killer Scripts copre i compiti che ricorrono in ogni ciclo di ticket. Ogni script funziona in PS 5.1, PS 7 e Kaseya LiveConnect senza dipendenze.
    privacyBody: Tutto viene eseguito nel tuo browser. Niente viene tracciato. Nessun account è mai richiesto. Il sito applica una rigorosa Content Security Policy per bloccare attacchi alla catena delle dipendenze. Se un pacchetto npm compromesso finisse nel bundle, non potrebbe comunicare all'esterno ciò che hai incollato.
    maintainedByPrefix: Creato e mantenuto da
    maintainedByMid: Se questo ti fa risparmiare tempo sul lavoro,
    buyMeCoffee: offrirmi un caffè
    maintainedBySuffix: è apprezzato ma mai richiesto.
    missingToolHeading: Manca uno strumento? Hai trovato un bug?
    issuesPrefix: Apri una richiesta di funzionalità o una segnalazione di bug nella
