about:
  content: |
    # killer-tools

    現場のテクニシャンに余計なものと付き合っている時間はありません。ここにあるツールはどれも、仕事中に必要になったのに、アカウントもインストールもテレメトリーもなしでちゃんと動くものが見つからなかったから作ったものです。

    私はMSPでネットワーク、サーバー管理、エンドポイントサポートを担当するフィールドテクニシャンです。killer-toolsは優れた[IT-Tools](https://github.com/CorentinTh/it-tools)プロジェクトのフォークとして始まり、私が実際にやっている仕事に合わせて育っていきました。チケット対応の途中でNDRコードを調べたり、クライアントのサブネットをスキャンしたり、クリックする前にSafeLinkをデコードしたりするために作りました。

    すべてブラウザ内で動作します。トラッキングは一切ありません。アカウント登録はいつでも不要です。

    開発とメンテナンスは[Steve the Killer](https://thekiller.net)が行っています。このサイトが現場での時間節約に役立ったなら、[コーヒーをおごって](https://www.buymeacoffee.com/StevetheKiller)もらえると嬉しいですが、決して強制ではありません。

    ## ほしいツールがない？バグを見つけた？

    GitHubの[issuesセクション](https://github.com/SteveTheKiller/killer-tools-site/issues/new/choose)から機能リクエストやバグ報告を送ってください。ちゃんと読んでいます。
