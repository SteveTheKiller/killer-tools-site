  privacy:
    heading: プライバシーポリシー
    lastUpdated: '最終更新日: 2026年4月4日'
    overviewHeading: 概要
    overviewIntro: Killer Tools
    overviewBody: は無料のITユーティリティツール集です。お客様のプライバシーを尊重し、このポリシーではデータの取り扱い方法について説明します。
    dataCollectionHeading: データ収集
    dataCollectionBody: Killer Toolsは個人データを収集、保存、送信しません。すべての処理はブラウザ内で完結します。ツールに入力したデータがサーバーに送信されることはありません。
    cookiesHeading: Cookie
    cookiesBody: このサイトはトラッキング目的でCookieを使用しません。テーマ設定はブラウザにローカル保存され、外部に送信されることはありません。
    analyticsHeading: アクセス解析
    analyticsIntro: このサイトでは
    analyticsBody: プライバシーに配慮したアクセス解析ツールを使用し、ページビューや参照元などの一般的な利用状況を把握しています。Umamiはcookieを使用せず、サイトをまたいでユーザーを追跡せず、個人を特定できる情報も収集しません。すべてのデータは集計済みで匿名化されています。
    thirdPartyHeading: 第三者サービス
    thirdPartyBody: 一部のツールは外部のリソースやドキュメントにリンクしている場合があります。それら外部サイトのプライバシー対応について、当方は責任を負いません。
    androidAppHeading: Androidアプリ
    androidAppBody: Killer ToolsのAndroidアプリはWebアプリケーションのラッパーです。基本的なインターネットアクセス以外のデバイス権限を要求またはアクセスすることはありません。デバイスデータの収集や送信も行いません。
    contactHeading: お問い合わせ
    contactBody: このプライバシーポリシーについて質問がある場合は、次の連絡先までご連絡ください
  androidApp:
    robotAttribution: AndroidロボットはGoogleが作成し公開した作品を複製または改変したもので、Creative Commons 3.0 Attribution Licenseに記載された条件に従って使用しています。
    heading: Android版Killer Tools
    introBody1: killertools.netのツールボックスをまるごとネイティブAndroidアプリに。すべてのツール、Killer Scriptsライブラリ、お気に入りすべてに、ホーム画面からワンタップでアクセスできます。
    introBody2: サイトと同じルールです。すべてデバイス上で動作します。アカウント不要、テレメトリなし、外部への通信もありません。現場でチケット対応の時間を節約できれば、それで役目を果たしたことになります。
    betaStatusPrefix: 現在アプリは
    betaStatusStrong: Google Playでクローズドベータ版
    betaStatusSuffix: です。ここであなたの出番です。
    joinBetaHeading: ベータ版に参加する
    joinBetaIntroPrefix: Googleの要件は
    joinBetaIntroStrong: アプリを14日間連続でインストールしたテスター12人
    joinBetaIntroSuffix: で、これを満たさないと個人開発者のアプリは公開できません。3つの手順、所要時間は約2分、あなたもその12人の1人になれます。
    step1LinkText: テスターグループに参加
    step1Suffix: Google Groupsで「Join group」をクリックします。
    step2LinkText: テスターになる
    step2Suffix: Google Playのオプトインページで。
    step3LinkText: アプリをインストール
    step3Suffix: Google Playから。2週間インストールしたままにしてください。
    sameAccountStrong: 3つの手順すべてで同じGoogleアカウントを使用してください
    sameAccountSuffix: 。スキップしたりアカウントを切り替えたりすると、オプトインページに「このアカウントでは利用できません」と表示されます。
    feedbackPrefix: '不具合や不足している機能はありますか。ご連絡ください:'
  home:
    sortPopular: 人気順
    sortAZ: A-Z
    sortZA: Z-A
  about:
    heading: Killer Toolsについて
    intro: 現場の技術者に無駄な機能を使う時間はありません。ここにある各ツールは、私自身が仕事で必要としながら、アカウント登録もインストールもテレメトリも無しでそのまま使えるものが見つからなかったために作られています。
    originPrefix: 現在はMSPの社内AIエンジニアリングチームでツールを開発しており、フルスタック開発6年、複数企業でのフィールド技術者8年の経験を経ています。KillerTools.netは、優れた
    originMid: が手がけたプロジェクトの
    originSuffix: フォークとして始まり、私が実際に行う仕事のために作り上げたものへと成長しました。チケット対応中にグループポリシー設定を調べたり、クライアントのサブネットをスキャンしたり、ブラウザを離れずにポート情報を参照したりするために作りました。
    scriptsLibrary: Killer Scriptsライブラリは、毎回のチケット対応で発生する作業をカバーしています。すべてのスクリプトはPS 5.1、PS 7、Kaseya LiveConnectで依存関係なしに動作します。
    privacyBody: すべてブラウザ内で動作します。何も追跡されません。アカウントは一切不要です。このサイトは厳格なContent Security Policyを適用し、依存関係を悪用した攻撃を防いでいます。侵害されたnpmパッケージがバンドルに紛れ込んでも、貼り付けた内容を外部に送信することはできません。
    maintainedByPrefix: '制作・保守:'
    maintainedByMid: これで仕事の時間が節約できたなら、
    buyMeCoffee: コーヒーをおごること
    maintainedBySuffix: 感謝しますが、期待はしていません。
