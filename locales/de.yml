  powershell-builder:
    title: PowerShell-Generator
    description: Wähle ein Cmdlet, fülle die Parameter aus und kopiere den fertigen PowerShell-Befehl.
  killer-pdf:
    title: KillerPDF
    description: Open-Source-PDF-Editor für Windows. Ansehen, kommentieren, zusammenführen, teilen, flachen, passwortgeschützte PDFs öffnen, Text bearbeiten, zeichnen, hervorheben, unterschreiben und drucken.
  killer-scan:
    title: KillerScan
    description: Schneller Netzwerkscanner für Techniker im Außendienst. ARP- und Ping-Erkennung, Port-Abfrage, Hersteller-Nachschlag und automatische Geräteklassifizierung.
  killer-shell:
    title: KillerShell
    description: Kostenlose Shell für Power-User. Ein Dateibrowser, ein Terminal und ein Texteditor teilen sich ein Fenster, eine Tableiste und einen Satz Tastenkürzel.
  killer-modules:
    ui:
      repo: Repo
      commands: Befehle
      requires: Voraussetzungen
      copyInstall: Installation kopieren
      copied: Kopiert!
      modules:
        KillerPivot:
          description: Wechseln Sie in PowerShell zwischen Microsoft 365 Tenants, ohne versehentlich Befehle im falschen Tenant auszuführen. KillerPivot deaktiviert den Auth Broker, um eine echte Anmeldeaufforderung zu erzwingen, fragt dann die Sitzung, in welchem Tenant sie wirklich gelandet ist, und prüft das, bevor Sie irgendetwas anfassen. Speichern Sie Ihre Tenants einmal und wechseln Sie dann per Name zwischen ihnen, mit eingebauter Identitätsprüfung.
          requirements: PowerShell 5.1 & 7 · ExchangeOnlineManagement v3+ · Microsoft.Graph.Authentication (für -Graph)
        KillerScripts:
          description: Jedes Tool aus dem killer-scripts Repo, verfügbar als Befehl in jeder PowerShell-Sitzung. Jedes Skript wird beim Ausführen direkt von GitHub geladen, sodass Sie immer die aktuelle Version haben, mit einem lokalen Cache als Offline-Fallback. Alle 18 Tools bekommen einen eigenen Befehl und einen kurzen Alias, sodass urt das Universal Rename Tool startet.
          requirements: PowerShell 5.1 & 7 · Internetzugang zum Abrufen des aktuellen Skripts (zwischengespeicherte Kopien laufen offline)
