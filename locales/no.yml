about:
  content: |
    # Om killer-tools
    Denne vidunderlige nettsiden, laget med ❤ av [Steve the Killer](https://thekiller.net) , sammenstiller nyttige verktøy for utviklere og folk som jobber innen IT. Hvis du finner dette nyttig, Del det gjerne med andre som du tror kan få nytte av dette, og ikke glem å lage et bokmerke!
    killer-tools er åpen kildekode (under GPL-3.0 lisensen) og gratis, og det vil det alltid være, men det koster å drifte og å fornye domenet. Hvis du ønsker å støtte arbeidet mitt, og motivere meg til å legge til flere verktøy, gjerne støtt meg ved å [sponse meg](https://www.buymeacoffee.com/StevetheKiller).
    ## Teknologier
    killer-tools er laget i Vue.js (Vue 3) med Naive UI komponent bibliotektet og er hosted og kontinuerlig deployet av GitHub. Tredjeparts åpen-kildekode biblioteker er brukt i noen verktøy, du kan finne den komplette listen i [package.json](https://github.com/SteveTheKiller/killer-tools-site/blob/main/package.json) filen i depoet.
    ## Funnet en feil? Et verktøy som mangler?
    Hvis du trenger et verktøy som foreløpig ikke er tilgjengelig her, og du tenker det kan være nyttig for andre, så er du velkommen til å legge til en funksjonsforespørsel i [problem seksjonen](https://github.com/SteveTheKiller/killer-tools-site/issues/new/choose) i github-depotet.
    Og hvis du har funnet en feil, eller noe ikke oppfører seg som forventet, vennligst send inn en feilrapport i [problem seksjonen](https://github.com/SteveTheKiller/killer-tools-site/issues/new/choose) i github-depotet.
