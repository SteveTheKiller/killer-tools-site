  privacy:
    heading: Personvernerklæring
    lastUpdated: 'Sist oppdatert: 4. april 2026'
    overviewHeading: Oversikt
    overviewIntro: Killer Tools
    overviewBody: er en gratis samling IT-verktøy. Personvernet ditt er viktig for oss, og denne erklæringen forklarer hvordan vi behandler dataene dine.
    dataCollectionHeading: Datainnsamling
    dataCollectionBody: Killer Tools samler ikke inn, lagrer eller overfører noen personopplysninger. All verktøybehandling skjer utelukkende i nettleseren din. Ingen data du skriver inn i et verktøy sendes til noen server.
    cookiesHeading: Informasjonskapsler
    cookiesBody: Dette nettstedet bruker ikke informasjonskapsler til sporing. Temapreferansene og innstillingene dine lagres lokalt i nettleseren og overføres aldri.
    analyticsHeading: Analyse
    analyticsIntro: Dette nettstedet bruker
    analyticsBody: et personvernvennlig analyseverktøy for å forstå generelle bruksmønstre som sidevisninger og henvisningskilder. Umami bruker ikke informasjonskapsler, sporer ikke brukere på tvers av nettsteder og samler ikke inn personidentifiserbar informasjon. Alle data er aggregert og anonyme.
    thirdPartyHeading: Tredjepartstjenester
    thirdPartyBody: Enkelte verktøy kan lenke til eksterne ressurser eller dokumentasjon. Vi er ikke ansvarlige for personvernpraksisen til disse eksterne nettstedene.
    androidAppHeading: Android-app
    androidAppBody: Killer Tools-appen for Android er en innpakning rundt webapplikasjonen. Den ber ikke om eller får tilgang til noen enhetstillatelser utover grunnleggende internettilgang. Ingen enhetsdata samles inn eller overføres.
    contactHeading: Kontakt
    contactBody: Hvis du har spørsmål om denne personvernerklæringen, kan du kontakte oss på
  androidApp:
    robotAttribution: Android-roboten er gjengitt eller endret fra arbeid skapt og delt av Google, og brukt i henhold til vilkårene beskrevet i Creative Commons 3.0 Attribution License.
    heading: Killer Tools for Android
    introBody1: 'Hele killertools.net-verktøykassen som en native Android-app: hvert verktøy, Killer Scripts-biblioteket og alle favorittene dine, ett trykk unna fra hjemskjermen.'
    introBody2: Samme regler som nettstedet. Alt kjører på enheten din. Ingen konto, ingen telemetri, ingen hjemringing. Hvis det sparer deg en billettsyklus i felt, har det gjort jobben sin.
    betaStatusPrefix: Appen er for øyeblikket i
    betaStatusStrong: lukket betaversjon på Google Play
    betaStatusSuffix: ', og her kommer du inn i bildet.'
    joinBetaHeading: Bli med i betaen
    joinBetaIntroPrefix: Google krever
    joinBetaIntroStrong: 12 testere med appen installert i 14 sammenhengende dager
    joinBetaIntroSuffix: 'før en app fra en uavhengig utvikler kan bli offentlig. Tre trinn, omtrent to minutter, og du er en av de tolv:'
    step1LinkText: Bli med i testergruppen
    step1Suffix: på Google Groups (klikk "Join group").
    step2LinkText: Bli en tester
    step2Suffix: på Google Plays påmeldingsside.
    step3LinkText: Installer appen
    step3Suffix: fra Google Play, og hold den installert i to uker.
    sameAccountStrong: Bruk samme Google-konto for alle tre trinnene
    sameAccountSuffix: ' - påmeldingssiden viser "ikke tilgjengelig for denne kontoen" hvis du hopper over gruppen eller bytter konto.'
    feedbackPrefix: 'Noe som er ødelagt eller mangler? Si fra til meg:'
  home:
    sortPopular: Populær
    sortAZ: A - Å
    sortZA: Å - A
  about:
    heading: Om Killer Tools
    intro: Feltteknikere har ikke tid til overflødig funksjonalitet. Hvert verktøy her finnes fordi jeg trengte det på jobb og ikke fant noe som bare fungerte uten konto, installasjon eller telemetri.
    originPrefix: Jeg bygger nå verktøy i det interne AI-ingeniørteamet til en MSP, etter seks år med full-stack-utvikling og åtte år som feltekniker i flere selskaper. KillerTools.net startet som en fork av det utmerkede
    originMid: prosjektet av
    originSuffix: og vokste til noe bygget for den typen arbeid jeg faktisk gjør. Jeg bygde det for å slå opp gruppepolicyinnstillinger midt i en sak, skanne en klients subnett, og hente frem portreferanser uten å forlate nettleseren.
    scriptsLibrary: Killer Scripts-biblioteket dekker oppgavene som dukker opp i hver billettsyklus. Hvert skript kjører i PS 5.1, PS 7 og Kaseya LiveConnect uten avhengigheter.
    privacyBody: Alt kjører i nettleseren din. Ingenting spores. Ingen konto kreves noensinne. Nettstedet håndhever en streng Content Security Policy for å blokkere angrep gjennom avhengighetskjeden. Hvis en kompromittert npm-pakke havner i pakken, kan den ikke ringe hjem med det du limte inn.
    maintainedByPrefix: Bygget og vedlikeholdt av
    maintainedByMid: Hvis dette sparer deg tid på jobben,
    buyMeCoffee: å kjøpe meg en kaffe
    maintainedBySuffix: settes pris på, men forventes aldri.
    missingToolHeading: Mangler et verktøy? Funnet en feil?
    issuesPrefix: Opprett en funksjonsforespørsel eller feilrapport i
    issuesLinkText: issues-delen
    issuesSuffix: på GitHub. Jeg leser dem.
