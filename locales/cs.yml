about:
  content: |
    # killer-tools

    Technici v terénu nemají čas na zbytečnosti. Každý nástroj tady existuje proto, že jsem ho potřeboval v práci a nenašel nic, co by prostě fungovalo bez účtu, instalace nebo telemetrie.

    Pracuji jako technik v terénu v MSP a starám se o sítě, správu systémů a podporu koncových zařízení. killer-tools vznikl jako fork skvělého projektu [IT-Tools](https://github.com/CorentinTh/it-tools) a vyrostl v něco vytvořeného pro práci, kterou skutečně dělám. Vytvořil jsem ho, abych mohl uprostřed tiketu vyhledat kódy NDR, proskenovat podsíť klienta a dekódovat SafeLink dřív, než na něj kliknu.

    Všechno běží ve vašem prohlížeči. Nic se nesleduje. Účet není potřeba, nikdy.

    Vytvořil a spravuje [Steve the Killer](https://thekiller.net). Pokud vám to v práci ušetří čas, [koupit mi kávu](https://www.buymeacoffee.com/StevetheKiller) potěší, ale nikdy se to neočekává.

    ## Chybí vám nástroj? Našli jste chybu?

    Otevřete požadavek na funkci nebo hlášení chyby v [sekci issues](https://github.com/SteveTheKiller/killer-tools-site/issues/new/choose) na GitHubu. Čtu je.
