pages:
  notFound:
    noSuchFile: Soubor nebo adresar neexistuje
    exitCode: navratovy kod
    backToHome: zpet na uvod
  privacy:
    heading: Zasady ochrany osobnich udaju
    lastUpdated: 'Naposledy aktualizováno: 4. dubna 2026'
    overviewHeading: Prehled
    overviewIntro: KillerTools
    overviewBody: je bezplatná sbírka IT nástrojů. Vaše soukromí je pro nás důležité a tyto zásady vysvětlují, jak nakládáme s vašimi údaji.
    dataCollectionHeading: Sber udaju
    dataCollectionBody: KillerTools neshromažďuje, neukládá ani nepředává žádné osobní údaje. Veškeré zpracování probíhá zcela ve vašem prohlížeči. Žádné údaje, které zadáte do některého nástroje, se neodesílají na server.
    cookiesHeading: Cookies
    cookiesBody: Tento web nepoužívá cookies pro sledování. Vaše preference vzhledu a nastavení se ukládají lokálně ve vašem prohlížeči a nikdy se nepřenášejí.
    analyticsHeading: Analytika
    analyticsIntro: Tento web pouziva
    analyticsBody: nástroj analytiky zaměřený na soukromí, k pochopení obecných vzorců používání, jako jsou zobrazení stránek a zdroje odkazů. Umami nepoužívá cookies, nesleduje uživatele napříč weby a neshromažďuje žádné osobně identifikovatelné informace. Všechna data jsou agregovaná a anonymní.
    thirdPartyHeading: Sluzby tretich stran
    thirdPartyBody: Některé nástroje mohou odkazovat na externí zdroje nebo dokumentaci. Nejsme odpovědní za postupy ochrany soukromí těch externích stránek.
    androidAppHeading: Aplikace pro Android
    androidAppBody: Android aplikace KillerTools je obal kolem webové aplikace. Nepožaduje ani nevyužívá žádná oprávnění zařízení nad rámec základního přístupu k internetu. Žádná data zařízení nejsou shromažďována ani předávána.
    contactHeading: Kontakt
    contactBody: Pokud máte dotazy ohledně těchto zásad ochrany osobních údajů, můžete nás kontaktovat na
  androidApp:
    robotAttribution: Android robot je reprodukován nebo upraven z díla vytvořeného a sdíleného společností Google a používán podle podmínek licence Creative Commons 3.0 Attribution.
    heading: KillerTools pro Android
    introBody1: 'Celá sada nástrojů killertools.net jako nativní Android aplikace: každý nástroj, knihovna Killer Scripts a všechny vaše oblíbené, jedno klepnutí od plochy.'
    introBody2: Stejná pravidla jako na webu. Vše běží na vašem zařízení. Žádný účet, žádná telemetrie, žádné volání domů. Pokud vám ušetří jeden cyklus tiketu v terénu, splnila svůj účel.
    betaStatusPrefix: Aplikace je momentalne v
    betaStatusStrong: uzavřené beta verzi na Google Play
    betaStatusSuffix: ', a tady přicházíte na řadu vy.'
    joinBetaHeading: Přidat se do beta verze
    joinBetaIntroPrefix: Google vyzaduje
    joinBetaIntroStrong: 12 testerů s nainstalovanou aplikací po dobu 14 po sobě jdoucích dní
    joinBetaIntroSuffix: 'než může aplikace nezávislého vývojáře jít na veřejnost. Tři kroky, asi dvě minuty, a jste jedním z dvanácti:'
    step1LinkText: Přidejte se do skupiny testerů
    step1Suffix: na Google Groups (klikněte na "Join group").
    step2LinkText: Staňte se testerem
    step2Suffix: na stránce Google Play pro prihlaseni.
    step3LinkText: Nainstalujte aplikaci
    step3Suffix: z Google Play a nechte ji nainstalovanou dva týdny.
    sameAccountStrong: Pro všechny tři kroky použijte stejný účet Google
    sameAccountSuffix: ' - přihlašovací stránka zobrazí "not available for this account", pokud vynecháte skupinu nebo přepnete účet.'
    feedbackPrefix: 'Něco je rozbité nebo chybí? Napište mi:'
  home:
    sortPopular: Oblibene
    sortAZ: A - Z
    sortZA: Z - A
  about:
    heading: O KillerTools
    intro: Terénní technici nemají čas na balast. Každý nástroj tady existuje proto, že jsem ho potřeboval při práci a nenašel jsem nic, co by prostě fungovalo bez účtu, instalace nebo telemetrie.
    originPrefix: Nyní tvořím nástroje v interním AI inženýrském týmu MSP, po šesti letech full-stack vývoje a osmi letech jako terénní technik u několika firem. KillerTools.net začal jako fork vynikajícího
    originMid: projektu od
    originSuffix: a vyrostl v něco, co je postavené pro druh práce, kterou skutečně dělám. Postavil jsem ho, abych mohl uprostřed tiketu vyhledávat nastavení Group Policy, skenovat podsíť klienta a hledat reference portů, aniž bych opustil prohlížeč.
    scriptsLibrary: Knihovna Killer Scripts pokrývá úkoly, které se objevují v každém cyklu tiketu. Každý skript běží v PS 5.1, PS 7 a Kaseya LiveConnect bez závislostí.
    privacyBody: Vše běží ve vašem prohlížeči. Nic se nesleduje. Účet není nikdy vyžadován. Web vynucuje přísnou Content Security Policy, aby blokoval útoky přes řetězec závislostí. Pokud by se kompromitovaný npm balíček někdy dostal do bundlu, nemůže poslat domů to, co jste vložili.
    maintainedByPrefix: Vytvoril a udrzuje
    maintainedByMid: Pokud vám to šetří čas v práci,
    buyMeCoffee: koupit mi kavu
    maintainedBySuffix: je vítáno, ale nikdy se nečekává.
    missingToolHeading: Chybí nástroj? Našli jste chybu?
    issuesPrefix: Otevřete požadavek na funkci nebo hlášení chyby v
    issuesLinkText: sekci issues
    issuesSuffix: na GitHubu. Cetu je.
    alsoTryHeading: Vyzkousejte take...
