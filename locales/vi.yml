  about:
    heading: Giới thiệu về Killer Tools
    intro: Kỹ thuật viên hiện trường không có thời gian cho những thứ rườm rà. Mỗi công cụ ở đây tồn tại vì tôi cần nó trong công việc và không tìm được thứ gì hoạt động tốt mà không cần tài khoản, cài đặt, hay đo từ xa.
    originPrefix: Hiện tôi xây dựng công cụ trong đội kỹ thuật AI nội bộ của một MSP, sau sáu năm phát triển full-stack và tám năm làm kỹ thuật viên hiện trường tại nhiều công ty. KillerTools.net khởi đầu là một bản fork của dự án
    originMid: xuất sắc bởi
    originSuffix: và phát triển thành thứ được xây dựng cho đúng loại công việc tôi thực sự làm. Tôi tạo ra nó để tra cứu cài đặt Group Policy ngay giữa lúc xử lý ticket, quét subnet của khách hàng, và tra cứu cổng mà không cần rời trình duyệt.
    scriptsLibrary: Thư viện Killer Scripts bao quát các công việc xuất hiện trong mọi chu kỳ ticket. Mỗi script chạy được trên PS 5.1, PS 7, và Kaseya LiveConnect mà không cần phụ thuộc nào.
    privacyBody: Mọi thứ chạy trong trình duyệt của bạn. Không gì bị theo dõi. Không bao giờ cần tài khoản. Trang web áp dụng Content Security Policy nghiêm ngặt để chặn các cuộc tấn công qua chuỗi phụ thuộc. Nếu một gói npm bị xâm phạm lọt vào bản build, nó cũng không thể gửi về những gì bạn đã dán vào.
    maintainedByPrefix: Được xây dựng và duy trì bởi
