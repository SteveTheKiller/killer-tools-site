    hostedBody: Không muốn cài đặt gì cả? Hãy kết nối trực tiếp đến máy chủ KillerTools được lưu trữ để dùng 64 tiện ích dựa trên web. 17 tiện ích KillerTools còn lại và tất cả công cụ của ứng dụng desktop yêu cầu runtime KillerMCP đã cài đặt.
