    joinBetaIntroPrefix: Google yêu cầu
    joinBetaIntroStrong: 12 người thử nghiệm cài đặt ứng dụng liên tục trong 14 ngày
    joinBetaIntroSuffix: 'trước khi một ứng dụng từ nhà phát triển độc lập có thể công khai. Ba bước, khoảng hai phút, và bạn sẽ là một trong mười hai người đó:'
