  privacy:
    heading: Chính sách bảo mật
    lastUpdated: 'Cập nhật lần cuối: 4 tháng 4, 2026'
    overviewHeading: Tổng quan
    overviewIntro: Killer Tools
    overviewBody: là một bộ công cụ IT miễn phí. Quyền riêng tư của bạn rất quan trọng với chúng tôi, và chính sách này giải thích cách chúng tôi xử lý dữ liệu của bạn.
    dataCollectionHeading: Thu thập dữ liệu
    dataCollectionBody: Killer Tools không thu thập, lưu trữ hay truyền tải bất kỳ dữ liệu cá nhân nào. Mọi xử lý công cụ đều diễn ra hoàn toàn trong trình duyệt của bạn. Không có dữ liệu nào bạn nhập vào công cụ được gửi đến máy chủ nào.
    cookiesHeading: Cookie
    cookiesBody: Trang web này không dùng cookie để theo dõi. Tùy chọn giao diện và cài đặt của bạn được lưu cục bộ trong trình duyệt và không bao giờ được truyền đi.
    analyticsHeading: Phân tích
    analyticsIntro: Trang web này sử dụng
    analyticsBody: một công cụ phân tích chú trọng quyền riêng tư, để hiểu các xu hướng sử dụng chung như lượt xem trang và nguồn giới thiệu. Umami không dùng cookie, không theo dõi người dùng qua các trang web, và không thu thập bất kỳ thông tin nhận dạng cá nhân nào. Mọi dữ liệu đều được tổng hợp và ẩn danh.
    thirdPartyHeading: Dịch vụ bên thứ ba
    thirdPartyBody: Một số công cụ có thể liên kết đến tài nguyên hoặc tài liệu bên ngoài. Chúng tôi không chịu trách nhiệm về chính sách bảo mật của các trang web bên ngoài đó.
    androidAppHeading: Ứng dụng Android
    androidAppBody: Ứng dụng Android của Killer Tools là một lớp bọc quanh ứng dụng web. Nó không yêu cầu hay truy cập bất kỳ quyền thiết bị nào ngoài quyền truy cập internet cơ bản. Không có dữ liệu thiết bị nào được thu thập hay truyền đi.
    contactHeading: Liên hệ
    contactBody: Nếu bạn có thắc mắc về chính sách bảo mật này, bạn có thể liên hệ với chúng tôi tại
  androidApp:
    robotAttribution: Robot Android được tái tạo hoặc chỉnh sửa từ tác phẩm do Google tạo ra và chia sẻ, sử dụng theo các điều khoản mô tả trong Giấy phép Creative Commons 3.0 Attribution.
    heading: Killer Tools cho Android
    introBody1: 'Toàn bộ bộ công cụ killertools.net dưới dạng ứng dụng Android gốc: mọi công cụ, thư viện Killer Scripts, và tất cả mục yêu thích của bạn, chỉ một chạm từ màn hình chính.'
    introBody2: Cùng quy tắc như trên trang web. Mọi thứ chạy trên thiết bị của bạn. Không tài khoản, không đo từ xa, không gửi dữ liệu về máy chủ. Nếu nó giúp bạn tiết kiệm một vòng xử lý ticket ngoài hiện trường, thế là nó đã hoàn thành nhiệm vụ.
