      modules:
        KillerPivot:
          description: Chuyển đổi giữa các tenant Microsoft 365 trong PowerShell mà không lo chạy nhầm lệnh vào tenant khác. KillerPivot tắt auth broker để buộc hiện màn hình đăng nhập thật, sau đó hỏi phiên làm việc xem thực sự đã vào tenant nào và xác minh điều đó trước khi bạn chạm vào bất cứ thứ gì. Lưu các tenant của bạn một lần, sau đó chuyển đổi giữa chúng theo tên với xác minh danh tính có sẵn.
          requirements: PowerShell 5.1 & 7 · ExchangeOnlineManagement v3+ · Microsoft.Graph.Authentication (cho -Graph)
        KillerScripts:
          description: Mọi công cụ trong repo killer-scripts, dùng được như một lệnh trong bất kỳ phiên PowerShell nào. Mỗi script được tải trực tiếp từ GitHub ngay khi bạn chạy, nên bạn luôn dùng phiên bản mới nhất, với bộ nhớ đệm cục bộ làm phương án dự phòng khi ngoại tuyến. Cả 18 công cụ đều có lệnh riêng và một alias ngắn, nên gõ urt sẽ chạy Universal Rename Tool.
          requirements: PowerShell 5.1 & 7 · Cần kết nối internet để lấy script hiện tại (bản sao lưu trong cache chạy được khi ngoại tuyến)
