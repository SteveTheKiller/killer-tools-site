  privacy:
    heading: Política de Privacidade
    lastUpdated: 'Última atualização: 4 de abril de 2026'
    overviewHeading: Visão geral
    overviewIntro: Killer Tools
    overviewBody: é uma coleção gratuita de ferramentas de TI. Sua privacidade é importante para nós, e esta política explica como tratamos seus dados.
    dataCollectionHeading: Coleta de dados
    dataCollectionBody: O Killer Tools não coleta, armazena ou transmite nenhum dado pessoal. Todo o processamento das ferramentas acontece inteiramente no seu navegador. Nenhum dado inserido em uma ferramenta é enviado a um servidor.
    cookiesHeading: Cookies
    cookiesBody: Este site não usa cookies para rastreamento. Suas preferências de tema e configurações são armazenadas localmente no navegador e nunca são transmitidas.
    analyticsHeading: Análises
    analyticsIntro: Este site usa
    analyticsBody: uma ferramenta de análise focada em privacidade, para entender padrões gerais de uso, como visualizações de página e origens de referência. O Umami não usa cookies, não rastreia usuários entre sites e não coleta nenhuma informação pessoal identificável. Todos os dados são agregados e anônimos.
    thirdPartyHeading: Serviços de terceiros
    thirdPartyBody: Algumas ferramentas podem linkar para recursos externos ou documentação. Não somos responsáveis pelas práticas de privacidade desses sites externos.
    androidAppHeading: App para Android
    androidAppBody: O app Killer Tools para Android é um invólucro em torno da aplicação web. Ele não solicita nem acessa nenhuma permissão do dispositivo além do acesso básico à internet. Nenhum dado do dispositivo é coletado ou transmitido.
    contactHeading: Contato
    contactBody: Se você tiver dúvidas sobre esta política de privacidade, pode entrar em contato conosco em
  androidApp:
    robotAttribution: O robô Android é reproduzido ou modificado a partir de um trabalho criado e compartilhado pelo Google, usado de acordo com os termos descritos na licença Creative Commons 3.0 Attribution.
    heading: Killer Tools para Android
    introBody1: 'Todo o conjunto de ferramentas do killertools.net como um app nativo para Android: cada ferramenta, a biblioteca Killer Scripts e todos os seus favoritos, a um toque da tela inicial.'
    introBody2: As mesmas regras do site. Tudo roda no seu dispositivo. Sem conta, sem telemetria, sem comunicação oculta. Se isso poupar um ciclo de chamado em campo, cumpriu seu papel.
    betaStatusPrefix: O app está atualmente em
    betaStatusStrong: beta fechado no Google Play
    betaStatusSuffix: ', e é aqui que você entra.'
    joinBetaHeading: Participe do beta
    joinBetaIntroPrefix: O Google exige
    joinBetaIntroStrong: 12 testadores com o app instalado por 14 dias seguidos
    joinBetaIntroSuffix: 'antes que um app de um desenvolvedor independente possa se tornar público. Três passos, cerca de dois minutos, e você será um dos doze:'
    step1LinkText: Entre no grupo de testadores
    step1Suffix: no Google Groups (clique em "Join group").
    step2LinkText: Torne-se um testador
    step2Suffix: na página de inscrição do Google Play.
    step3LinkText: Instale o app
    step3Suffix: pelo Google Play e mantenha-o instalado por duas semanas.
    sameAccountStrong: Use a mesma conta do Google nos três passos
    sameAccountSuffix: ' - a página de inscrição mostra "não disponível para esta conta" se você pular o grupo ou trocar de conta.'
