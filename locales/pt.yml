  about:
    heading: Sobre o Killer Tools
    intro: Técnicos de campo não têm tempo para excessos. Cada ferramenta aqui existe porque eu precisei dela no trabalho e não conseguia encontrar algo que simplesmente funcionasse sem conta, instalação ou telemetria.
    originPrefix: Hoje eu construo ferramentas na equipe interna de engenharia de IA de uma MSP, depois de seis anos de desenvolvimento full-stack e oito anos como técnico de campo em várias empresas. O KillerTools.net começou como um fork do excelente
    originMid: projeto de
    originSuffix: e cresceu até se tornar algo feito para o tipo de trabalho que eu realmente faço. Eu o construí para consultar configurações de política de grupo no meio de um chamado, escanear a sub-rede de um cliente e buscar referências de portas sem sair do navegador.
    scriptsLibrary: A biblioteca Killer Scripts cobre as tarefas que surgem em todo ciclo de chamado. Cada script roda em PS 5.1, PS 7 e Kaseya LiveConnect sem dependências.
    privacyBody: Tudo roda no seu navegador. Nada é rastreado. Nenhuma conta é exigida, nunca. O site aplica uma Content Security Policy rigorosa para bloquear ataques na cadeia de dependências. Se um pacote npm comprometido acabar no pacote final, ele não conseguirá enviar para fora o que você colou.
    maintainedByPrefix: Criado e mantido por
    maintainedByMid: Se isso economiza seu tempo no trabalho,
    buyMeCoffee: me pagar um café
    maintainedBySuffix: é bem-vindo, mas nunca esperado.
    missingToolHeading: Falta uma ferramenta? Encontrou um bug?
    issuesPrefix: Abra uma solicitação de recurso ou relatório de bug na
    issuesLinkText: seção de issues
    issuesSuffix: no GitHub. Eu leio todos.
