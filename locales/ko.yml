  privacy:
    heading: 개인정보 처리방침
    lastUpdated: '최종 업데이트: 2026년 4월 4일'
    overviewHeading: 개요
    overviewIntro: Killer Tools
    overviewBody: 는 무료 IT 유틸리티 도구 모음입니다. 여러분의 개인정보는 중요하며, 이 방침은 데이터를 어떻게 처리하는지 설명합니다.
    dataCollectionHeading: 데이터 수집
    dataCollectionBody: Killer Tools는 어떠한 개인 데이터도 수집, 저장, 전송하지 않습니다. 모든 도구 처리는 전적으로 브라우저에서 이루어집니다. 도구에 입력한 데이터는 어떤 서버로도 전송되지 않습니다.
    cookiesHeading: 쿠키
    cookiesBody: 이 사이트는 추적용 쿠키를 사용하지 않습니다. 테마 기본 설정과 설정은 브라우저에 로컬로 저장되며 절대 전송되지 않습니다.
    analyticsHeading: 분석
    analyticsIntro: 이 사이트는 페이지 조회수와 유입 경로 같은 전반적인 사용 패턴을 파악하기 위해
    analyticsBody: 를 사용합니다. 이는 개인정보 보호 중심의 분석 도구입니다. Umami는 쿠키를 사용하지 않고, 사이트 간에 사용자를 추적하지 않으며, 개인 식별 정보를 수집하지 않습니다. 모든 데이터는 집계되고 익명화됩니다.
    thirdPartyHeading: 타사 서비스
    thirdPartyBody: 일부 도구는 외부 자료나 문서로 연결될 수 있습니다. 해당 외부 사이트의 개인정보 처리 관행에 대해서는 책임지지 않습니다.
    androidAppHeading: Android 앱
    androidAppBody: Killer Tools Android 앱은 웹 애플리케이션을 감싼 래퍼입니다. 기본 인터넷 접근 외에는 어떠한 기기 권한도 요청하거나 사용하지 않습니다. 기기 데이터는 수집되거나 전송되지 않습니다.
    contactHeading: 문의
    contactBody: 이 개인정보 처리방침에 대해 궁금한 점이 있으면 다음으로 연락하세요
  androidApp:
    heroAlt: 현장 기술자를 위한 IT 유틸리티 도구, Android용 Killer Tools
    robotAttribution: Android 로봇은 Google이 제작하고 공유한 저작물을 복제하거나 수정한 것이며, Creative Commons 3.0 저작자 표시 라이선스에 설명된 조건에 따라 사용됩니다.
    heading: Android용 Killer Tools
    introBody1: 'killertools.net의 모든 도구를 네이티브 Android 앱으로 제공합니다. 모든 도구, Killer Scripts 라이브러리, 즐겨찾기를 홈 화면에서 탭 한 번으로 사용할 수 있습니다.'
    introBody2: 규칙은 사이트와 같습니다. 모든 것이 기기에서 실행됩니다. 계정도, 원격 분석도, 외부 통신도 없습니다. 현장에서 티켓 처리 한 번이라도 줄여 준다면 제 역할을 한 것입니다.
    betaStatusPrefix: 이 앱은 현재
    betaStatusStrong: Google Play 비공개 베타
    betaStatusSuffix: ' 중이며, 여기서 여러분의 도움이 필요합니다.'
    joinBetaHeading: 베타 참여하기
    joinBetaIntroPrefix: Google은 독립 개발자의 앱을 공개하기 전에
    joinBetaIntroStrong: 테스터 12명이 14일 연속으로 앱을 설치한 상태
    joinBetaIntroSuffix: '를 요구합니다. 세 단계, 약 2분이면 12명 중 한 명이 될 수 있습니다:'
    step1LinkText: 테스터 그룹 가입
    step1Suffix: Google Groups에서 진행합니다("그룹 가입" 클릭).
    step2LinkText: 테스터 되기
    step2Suffix: Google Play 참여 페이지에서 진행합니다.
    step3LinkText: 앱 설치
    step3Suffix: Google Play에서 설치하고 2주 동안 유지하세요.
    sameAccountStrong: 세 단계 모두 같은 Google 계정을 사용하세요
    sameAccountSuffix: '. 그룹 가입을 건너뛰거나 계정을 바꾸면 참여 페이지에 "이 계정에서는 사용할 수 없음"이라고 표시됩니다.'
    feedbackPrefix: '문제가 있거나 빠진 기능이 있나요? 알려 주세요:'
  home:
