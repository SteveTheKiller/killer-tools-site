    sortZA: Z - A
  about:
    heading: Killer Tools 소개
    intro: 현장 기술자에게는 군더더기에 쓸 시간이 없습니다. 여기 있는 모든 도구는 제가 업무 중에 필요했지만 계정, 설치, 원격 분석 없이 바로 동작하는 것을 찾지 못해서 만든 것입니다.
    originPrefix: 저는 6년간의 풀스택 개발과 여러 회사에서 8년간 현장 기술자로 일한 뒤, 지금은 MSP의 사내 AI 엔지니어링 팀에서 도구를 만들고 있습니다. KillerTools.net은 다음의 훌륭한
    originMid: 프로젝트(제작자
    originSuffix: )의 포크로 시작해, 제가 실제로 하는 일에 맞춘 도구로 성장했습니다. 티켓 처리 중에 그룹 정책 설정을 조회하고, 고객의 서브넷을 스캔하고, 브라우저를 떠나지 않고 포트 참조를 찾으려고 만들었습니다.
    scriptsLibrary: Killer Scripts 라이브러리는 티켓 처리 때마다 반복되는 작업을 다룹니다. 모든 스크립트는 의존성 없이 PS 5.1, PS 7, Kaseya LiveConnect에서 실행됩니다.
    privacyBody: 모든 것은 브라우저에서 실행됩니다. 아무것도 추적하지 않습니다. 계정은 절대 필요하지 않습니다. 사이트는 엄격한 Content Security Policy를 적용해 의존성 체인 공격을 차단합니다. 손상된 npm 패키지가 번들에 들어오더라도, 붙여 넣은 내용을 외부로 보낼 수 없습니다.
    maintainedByPrefix: 만들고 관리하는 사람
    maintainedByMid: 업무 시간을 아끼는 데 도움이 되었다면,
    buyMeCoffee: 커피 한 잔
    maintainedBySuffix: 은 감사히 받겠지만 결코 기대하지는 않습니다.
