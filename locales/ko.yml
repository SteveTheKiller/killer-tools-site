      scan4: killer 이 네트워크 스캔으로 PDF 보고서 만들기
      shell1: killershell 이 컴퓨터에서 실행 중인 서비스 나열
      shell2: killershell C:\Docs에서 invoice라는 이름의 파일 검색
      shell3: killer 최신 Application 로그 항목 표시
      shell4: killer 이 디렉터리 목록을 PDF로 저장
      calendar1: killendar 내일 내 약속 표시
      calendar2: killendar 내일 오전 9시에 Morning standup이라는 약속 만들기
      calendar3: killer 앞으로 7일간 내 일정 표시
      calendar4: killer 다음 주 일정을 메모로 저장
      bench1: killerbench Windows 오류 코드 5 조회
      bench2: killerbench 아무것도 변경하지 않고 이 컴퓨터의 상태 점검
      bench3: killerbench 읽기 전용 진단 스캔 실행
      bench4: killerbench 내 진단 작업 결과 표시
      shot1: killershot 내 모니터 나열
      shot2: killershot 현재 모니터 스크린샷 찍기
      shot3: killershot 최근 캡처 표시
      shot4: killershot 이 이미지의 텍스트 읽기
    twice:
      title: '{km}이(가) 두 번 실행되는 이유'
      body: Claude Desktop은 각 로컬 MCP 서버를 두 번 시작합니다. 하나는 앱 자체의 채팅을, 다른 하나는 이 컴퓨터를 원격으로 사용하는 Claude 세션을 처리합니다. 작업 관리자에서 Claude 아래에 KillerMCP.exe 프로세스가 두 개 보이는 것은 정상입니다. KillerMCP가 두 번 설치된 것이 아니며, 고칠 것은 없습니다.
    can:
      title: 무엇을 할 수 있나요?
      intro: '평범한 말로 요청하세요. 에이전트가 사용 가능한 도구와 입력값을 찾아 필요한 도구를 호출합니다. 예를 들어 다음을 할 수 있습니다:'
      i1: IPv4 서브넷 계산, 주소 범위 확장, IPv6 ULA 접두사 생성, MAC 공급업체 조회.
      i2: DNS 레코드와 도메인 등록 정보 확인, CVE 검색, 포트와 프로토콜 식별.
      i3: 이메일 헤더 분석, SPF 또는 DMARC 레코드 생성, Exchange NDR 메시지 조회.
      i4: Windows 오류 및 이벤트 ID, 그룹 정책 설정, M365 라이선스 SKU 찾기.
      i5: PowerShell cmdlet을 검색하고, 실행 전에 검토할 수 있도록 명령을 조립.
      i6: JSON과 XML 포맷, JSON을 CSV로 또는 JSON, YAML, TOML 간 변환, Base64 디코딩, 문서 비교, 정규식 테스트.
      i7: QR 코드, UUID, 메타 태그, 플레이스홀더 생성, 또는 사진 노출과 필름 계산.
      i8: 대소문자, 날짜, 시간, 온도, 색상, 진법, 로마 숫자, 2진수 텍스트, NATO 철자, 전화번호 형식 변환.
      i9: SQL, YAML, TOML, Markdown, HTML 엔티티, 구조화된 데이터 포맷, 또는 백분율, cron 일정, chmod 값 계산.
      i10: 이모지, GIF, KillerScripts, Killer 모듈 검색, 또는 URL, user agent, HTTP 상태 코드, 텍스트 통계 확인.
    cov:
      title: 어떤 연결이 무엇을 하나요?
      hostedTitle: Cloudflare 서버
      hostedBody: 웹에서 안전한 유틸리티 64개, 작업 74개. HTTP로 원격 실행되며 설치가 필요 없습니다. 로컬 앱이나 파일에는 접근할 수 없습니다.
      installedTitle: Windows 설치
      installedBody: KillerTools 유틸리티 81개 전체와 작업 94개, 그리고 설치된 지원 Killer 앱의 명령. 로컬 MCP 연결로 실행됩니다.
      browserTitle: 브라우저 도우미
      browserBody: 카메라, 기기, 편집기, 서명 도구는 비공개 localhost 페이지를 엽니다.
    data:
      title: 데이터는 어디로 가나요?
      p1: 설치된 KillerMCP 런타임은 내 컴퓨터에서 실행됩니다. 일부 네트워크 및 참조 조회는 여전히 공개 데이터 소스에 접속합니다. 에이전트는 요청을 완료하는 데 필요한 입력과 결과를 받습니다.
      p2: 선택 사항인 호스팅 연결은 도구 입력을 KillerTools Cloudflare Worker로 보냅니다. 로그인이 없고, 요청 본문을 64 KiB로 제한하며, 제한된 스키마를 적용하고, 연결하는 IP마다 속도를 제한합니다. 호스팅 연결로 비밀번호, 개인 파일, 토큰, 고객 데이터를 보내지 마세요.
      p3: 로컬 파일, 브라우저, 비밀번호, 토큰, 암호화, 해싱, OTP, BIP39, 키 생성 도구는 공개 Worker에서 제외됩니다. 이 도구들은 설치된 KillerMCP로 실행되지만, MCP 클라이언트와 모델 제공자는 여전히 입력과 결과를 받을 수 있습니다.
    oss:
      title: 오픈 소스와 현재 제한 사항
      p1: '{kt}에는 공개 Worker, 로컬 KillerTools 번들, 작업 매핑, 검증 스키마, 적용 범위 검사가 포함되어 있습니다. {km}에는 공유 로컬 호스트, 데스크톱 앱 어댑터, 설치 프로그램, 통합 검사가 포함되어 있습니다.'
      ktLink: KillerTools 소스
      kmLink: KillerMCP 소스
      p2: 외부 조회 결과는 해당 소스에 따라 달라집니다. 로컬 도구는 도구 호출에서 제공된 경로나 값만 받습니다. Base64 파일 디코딩은 새 파일을 만들며 기존 파일을 덮어쓰지 않습니다. 카메라 캡처는 여전히 브라우저 권한을 직접 허용하고 하드웨어를 확인해야 합니다. 현재 KillerMCP 설치 프로그램은 서명과 타임스탬프가 적용되어 GitHub Releases를 통해 배포됩니다.
