about:
  content: |
    # killer-tools

    현장 기술자에게는 군더더기에 쓸 시간이 없습니다. 여기 있는 모든 도구는 제가 업무 중에 필요했지만 계정, 설치, 원격 분석 없이 바로 동작하는 것을 찾지 못해서 만든 것입니다.

    저는 MSP에서 네트워킹, 시스템 관리, 엔드포인트 지원을 담당하는 현장 기술자입니다. killer-tools는 훌륭한 [IT-Tools](https://github.com/CorentinTh/it-tools) 프로젝트의 포크로 시작해, 제가 실제로 하는 일에 맞춘 도구로 성장했습니다. 티켓 처리 중에 NDR 코드를 조회하고, 고객의 서브넷을 스캔하고, SafeLink를 클릭하기 전에 디코딩하려고 만들었습니다.

    모든 것은 브라우저에서 실행됩니다. 아무것도 추적하지 않습니다. 계정은 절대 필요하지 않습니다.

    [Steve the Killer](https://thekiller.net)가 만들고 관리합니다. 업무 시간을 아끼는 데 도움이 되었다면 [커피 한 잔](https://www.buymeacoffee.com/StevetheKiller)은 감사히 받겠지만, 결코 기대하지는 않습니다.

    ## 원하는 도구가 없나요? 버그를 발견했나요?

    GitHub의 [이슈 섹션](https://github.com/SteveTheKiller/killer-tools-site/issues/new/choose)에서 기능 요청이나 버그 보고를 열어 주세요. 모두 읽고 있습니다.
