        KillerPivot:
          description: 엉뚱한 테넌트에 명령을 실행하지 않고 PowerShell에서 Microsoft 365 테넌트를 전환합니다. KillerPivot은 인증 브로커를 비활성화해 실제 로그인 창을 띄운 뒤, 세션이 실제로 어느 테넌트에 연결되었는지 확인하고 검증한 다음에야 작업을 시작하게 합니다. 테넌트를 한 번 저장해 두면 ID 검증이 내장된 상태로 이름만으로 전환할 수 있습니다.
          requirements: PowerShell 5.1 & 7 · ExchangeOnlineManagement v3+ · Microsoft.Graph.Authentication (-Graph 사용 시)
        KillerScripts:
          description: killer-scripts 저장소의 모든 도구를 어떤 PowerShell 세션에서든 명령으로 사용할 수 있습니다. 각 스크립트는 실행하는 순간 GitHub에서 새로 가져오므로 항상 최신 버전을 사용하며, 오프라인일 때는 로컬 캐시를 사용합니다. 19개 도구 모두 고유한 명령과 짧은 별칭이 있어 urt를 입력하면 Universal Rename Tool이 실행됩니다.
          requirements: PowerShell 5.1 & 7 · 최신 스크립트를 가져오기 위한 인터넷 연결 (캐시된 사본은 오프라인으로 실행)
  killer-notes:
    title: KillerNotes
    description: 기술자를 위한 암호화 메모장입니다. 서식 있는 텍스트, 인라인 이미지, 실제 표, 즉시 검색, SQLCipher AES-256, .knote 공유를 지원합니다.
  killendar:
    title: The Killendar
    description: Windows용 암호화 데스크톱 캘린더입니다. 월, 주, 일, 일정 목록 보기, 색상 범주, iCalendar 가져오기와 내보내기를 지원하며, 약속은 내 컴퓨터의 파일 하나에 저장됩니다. 계정, 동기화, 원격 분석이 없습니다.
