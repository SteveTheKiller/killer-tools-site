      after: 연결 후
    lead: 에이전트에게 유용한 KillerTools 명령을 제공하세요. 웹에서 안전하게 쓸 수 있는 유틸리티는 공개 Cloudflare 서버에 연결하고, 로컬 도구와 지원되는 Killer 앱은 Windows에 KillerMCP를 설치해 사용하세요.
    status: 사용하려는 데이터와 앱에 맞는 연결 방식을 선택하세요.
    install: 설치
    intro: Windows 설치 프로그램은 81개 KillerTools 유틸리티 전체와, 이 컴퓨터에 설치된 지원 Killer 앱이 제공하는 명령을 하나의 로컬 연결로 에이전트에 제공합니다. 앱 명령은 앱 버전과 사용 가능 여부에 따라 달라집니다. 별도의 Node나 소스 체크아웃은 필요 없습니다.
    download: Windows용 다운로드
    meta:
      version: 버전 {version}
      signed: 디지털 서명됨
      hosted: GitHub Releases에서 호스팅
    steps:
      s1Title: KillerMCP Setup을 다운로드하여 실행하세요.
      s1Body: Setup은 .NET 10 런타임을 확인하고, 없으면 Microsoft 다운로드 페이지를 엽니다. 설치 프로그램은 Open Source Developer Stephen Riley가 서명했으며 GitHub Releases를 통해 배포됩니다.
      s2Title: Setup이 에이전트를 연결하도록 하세요.
      s2Body: 공유 런타임을 설치하고, 발견되는 경우 Codex, Claude Code, Claude Desktop, Cursor, GitHub Copilot, Gemini CLI, Windsurf에 KillerMCP를 등록합니다.
      s3Title: 새 에이전트 채팅을 열고 요청하세요.
      s3Body: KillerMCP는 하나의 연결로 사용 가능한 KillerTools와 설치된 앱 명령을 찾아냅니다.
    hostedTitle: 설치 없이 연결
    hostedBody: 공개 Cloudflare 서버는 HTTP 연결로 웹에서 안전하게 쓸 수 있는 KillerTools 유틸리티 64개를 제공합니다. Windows 파일이나 설치된 Killer 앱에는 접근할 수 없습니다. 나머지 KillerTools 유틸리티 17개와 모든 데스크톱 앱 명령은 KillerMCP 설치가 필요합니다.
    actions:
      cursor: Cursor에 추가
      vscode: VS Code에 추가
      claude: URL 복사 후 Claude 열기
      codex: Codex 설정 명령 복사
      claudeCode: Claude Code 설정 명령 복사
      copyUrl: URL 복사
      copyCommand: 명령 복사
    otherClient: 다른 MCP 클라이언트를 사용하나요? 서버 URL을 복사하세요.
    shortest: '가장 짧고 유용한 프롬프트는 {prompt}입니다. 예: {example}.'
    infer: 에이전트는 작업과 주어진 맥락에서 알맞은 KillerTools나 Killer 앱 도구를 추론할 수 있습니다. 대상을 명시하고 싶을 때만 {a}, {b}, {c} 또는 다른 앱 이름을 사용하세요. 밑줄, 작업 이름, 슬래시 명령은 필요 없습니다.
    worker:
      title: Cloudflare Worker의 작동 방식
      p1: 공개 엔드포인트는 웹사이트와 별도로 배포된 오픈 소스 스트리밍 HTTP MCP 서버입니다. MCP 클라이언트는 도구 이름과 제한된 인수를 {url}(으)로 보냅니다. Worker는 요청을 검증하고, 선택한 유틸리티를 실행한 뒤 결과를 반환합니다.
      p2: 대부분의 계산과 변환은 Worker에서 직접 실행됩니다. DNS 쿼리는 Cloudflare DNS over HTTPS를 사용합니다. 도메인 등록 정보는 IANA RDAP 디렉터리를 따릅니다. CVE, GIF, 카탈로그 검색은 각 공개 제공자에 접속하므로 제공자가 사용할 수 없거나 속도 제한이 걸리면 실패할 수 있습니다.
    examples:
      title: 이렇게 요청해 보세요
      intro: '{killer}(으)로 시작하고 원하는 결과를 설명하세요. 작업이 명확하면 앱이나 도구 이름은 생략해도 됩니다.'
