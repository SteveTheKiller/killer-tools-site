  privacy:
    heading: Adatvedelmi tajekoztato
    lastUpdated: 'Utolso frissites: 2026. aprilis 4.'
    overviewHeading: Attekintes
    overviewIntro: KillerTools
    overviewBody: egy ingyenes IT eszközgyujtemeny. Az on adatvedelme fontos szamunkra, es ez a tajekoztato elmagyarazza, hogyan kezeljuk az adatait.
    dataCollectionHeading: Adatgyujtes
    dataCollectionBody: A KillerTools semmilyen szemelyes adatot nem gyujt, nem tarol es nem tovabbit. Minden eszkoz feldolgozas teljes egeszeben a bongeszojeben tortenik. Semmilyen, egy eszkozbe beirt adat nem kerul elkuldesre semmilyen szerverre.
    cookiesHeading: Sutik
    cookiesBody: Ez az oldal nem hasznal sutiket nyomon kovetesre. A tema- es beallitasi preferenciai helyileg, a bongeszojeben taroloak, es soha nem kerulnek tovabbitasra.
    analyticsHeading: Analitika
    analyticsIntro: Ez az oldal hasznalja a
    analyticsBody: egy adatvedelem-kozpontu analitikai eszkozt, hogy megertse az altalanos hasznalati mintakat, mint az oldalmegtekintesek es a hivatkozasi forrasok. Az Umami nem hasznal sutiket, nem koveti a felhasznalokat weboldalak kozott, es nem gyujt semmilyen szemelyazonositasra alkalmas informaciot. Minden adat aggregalt es anonim.
    thirdPartyHeading: Harmadik feles szolgaltatasok
    thirdPartyBody: Nehany eszkoz kulso forrasokra vagy dokumentaciora mutathat. Nem vagyunk felelosek ezen kulso oldalak adatvedelmi gyakorlatáert.
    androidAppHeading: Android alkalmazas
    androidAppBody: A KillerTools Android alkalmazas a webalkalmazas koreli buroknak. Nem ker es nem er el semmilyen eszkozengedelyt az alapveto internet-hozzaferesen tul. Semmilyen eszkozadat nem kerul gyujtesre vagy tovabbitasra.
    contactHeading: Kapcsolat
    contactBody: Ha kerdese van ezzel az adatvedelmi tajekoztatoval kapcsolatban, elerhet minket a
  androidApp:
    robotAttribution: Az Android robot a Google altal letrehozott es megosztott munkabol keszult vagy modositott reprodukcio, a Creative Commons 3.0 Attribution License feltetelei szerint hasznalva.
    heading: KillerTools Androidra
    introBody1: 'A teljes killertools.net eszkoztar natív Android alkalmazaskent: minden eszkoz, a Killer Scripts konyvtar es az osszes kedvence, egyetlen erintesre a kezdokepernyorol.'
    introBody2: Ugyanazok a szabalyok, mint az oldalon. Minden az on eszkozen fut. Nincs fiok, nincs telemetria, nincs hazatelefonalas. Ha megsporol egy ticketciklust a terepen, betoltotte a feladatat.
    betaStatusPrefix: Az alkalmazas jelenleg
    betaStatusStrong: zart betaban van a Google Play-en
    betaStatusSuffix: ', es itt jon a kepbe on.'
    joinBetaHeading: Csatlakozzon a betahoz
    joinBetaIntroPrefix: A Google megkoveteli, hogy
    joinBetaIntroStrong: 12 tesztelo 14 egymast koveto napig telepitve tartsa az alkalmazast
    joinBetaIntroSuffix: 'mielott egy fuggetlen fejleszto alkalmazasa nyilvanossa valhat. Harom lepes, korulbelul ket perc, es on is a tizenketto egyike lesz:'
    step1LinkText: Csatlakozzon a tesztelo csoporthoz
    step1Suffix: a Google Groups-on (kattintson a "Join group" gombra).
    step2LinkText: Valjon teszteloVe
    step2Suffix: a Google Play jelentkezesi oldalan.
    step3LinkText: Telepitse az alkalmazast
    step3Suffix: a Google Play-rol, es tartsa telepitve ket hetig.
    sameAccountStrong: Hasznalja ugyanazt a Google fiokot mindharom lepeshez
    sameAccountSuffix: ' - a jelentkezesi oldal "not available for this account" uzenetet jelenit meg, ha kihagyja a csoportot vagy fiokot valt.'
    feedbackPrefix: 'Valami elromlott vagy hianyzik? Szoljon nekem:'
  home:
    sortPopular: Nepszeru
    sortAZ: A - Z
    sortZA: Z - A
  about:
    heading: A KillerTools-rol
    intro: A terepi technikusoknak nincs idejuk a felesleges csomagolasra. Minden eszkoz azert letezik itt, mert szuksegem volt ra munka kozben, es nem talaltam olyat, ami egyszeruen mukodott fiok, telepites vagy telemetria nelkul.
    originPrefix: Jelenleg egy MSP belso AI mernoki csapataban epitek eszkozoket, hat ev full-stack fejlesztes es nyolc ev terepi technikuskent, tobb cegnel szerzett tapasztalat utan. A KillerTools.net a kivalo
    originMid: projekt forkjakent indult, amelyet
    originSuffix: keszitett, es olyan valamive novekedett, ami az altalam vegzett munkahoz keszult. Azert epitettem, hogy kozepen egy ticketben Group Policy beallitasokat nezhessek meg, egy ugyfel alhalozatat pasztazzam, es port referenciakat keressek ki a bongeszo elhagyasa nelkul.
    scriptsLibrary: A Killer Scripts konyvtar lefedi azokat a feladatokat, amelyek minden ticketciklusban felmerulnek. Minden szkript fut PS 5.1, PS 7 es Kaseya LiveConnect alatt, fuggosegek nelkul.
    privacyBody: Minden a bongeszojeben fut. Semmit nem kovetnek nyomon. Fiokra soha nincs szukseg. Az oldal szigoru Content Security Policy-t kenyszerit ki, hogy blokkolja a fuggosegi lanc menten erkezo tamadasokat. Ha egy kompromittalt npm csomag valaha bekerulne a csomagba, nem tudna hazatelefonalni azzal, amit beillesztett.
    maintainedByPrefix: Keszitette es karbantartja
    maintainedByMid: Ha ez idot sporol onnek a munkaban,
    buyMeCoffee: vegyen nekem egy kavet
    maintainedBySuffix: orommel fogadott, de soha nem elvart.
