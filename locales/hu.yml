          description: Váltson Microsoft 365 tenantok között PowerShellben anélkül, hogy rossz helyre küldene parancsokat. A KillerPivot letiltja az auth brokert, hogy valódi bejelentkezési ablakot kényszerítsen ki, majd megkérdezi a munkamenettől, valójában melyik tenantba jutott, és ezt ellenőrzi, mielőtt bármihez hozzáérne. Mentse el egyszer a tenantjait, majd váltson köztük néven, beépített azonosság-ellenőrzéssel.
          requirements: PowerShell 5.1 & 7 · ExchangeOnlineManagement v3+ · Microsoft.Graph.Authentication (a -Graph-hoz)
        KillerScripts:
          description: A killer-scripts repo minden eszköze, parancsként elérhető bármely PowerShell munkamenetben. Minden szkript futtatáskor frissen a GitHubról töltődik le, így mindig az aktuális verzión dolgozik, helyi gyorsítótárral offline tartalékként. Mind a 18 eszköznek saját parancsa és rövid aliasa van, így az urt begépelése a Universal Rename Toolt futtatja.
          requirements: PowerShell 5.1 & 7 · Internetkapcsolat szükséges az aktuális szkript letöltéséhez (a gyorsítótárazott másolatok offline is futnak)
