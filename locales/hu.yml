about:
  content: |
    # killer-tools

    A terepen dolgozó technikusoknak nincs idejük a felesleges körítésre. Minden eszköz azért van itt, mert szükségem volt rá munka közben, és nem találtam olyat, ami fiók, telepítés vagy telemetria nélkül egyszerűen működött volna.

    Terepen dolgozó technikus vagyok egy MSP-nél, hálózatokkal, rendszergazdai munkával és végponttámogatással foglalkozom. A killer-tools a kiváló [IT-Tools](https://github.com/CorentinTh/it-tools) projekt forkjaként indult, és olyasmivé nőtte ki magát, ami arra a munkára készült, amit ténylegesen végzek. Azért készítettem, hogy egy jegy közepén kikereshessem az NDR-kódokat, átvizsgálhassam egy ügyfél alhálózatát, és dekódolhassak egy SafeLinket, mielőtt rákattintok.

    Minden a böngésződben fut. Semmit nem követünk nyomon. Fiókra soha nincs szükség.

    Készítette és karbantartja: [Steve the Killer](https://thekiller.net). Ha ez időt spórol neked a munkában, [egy kávé](https://www.buymeacoffee.com/StevetheKiller) jólesik, de soha nem elvárás.

    ## Hiányzik egy eszköz? Hibát találtál?

    Nyiss funkciókérést vagy hibajelentést a GitHub [issues részében](https://github.com/SteveTheKiller/killer-tools-site/issues/new/choose). Elolvasom őket.
