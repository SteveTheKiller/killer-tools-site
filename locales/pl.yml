        KillerScripts:
          description: Każde narzędzie z repo killer-scripts, dostępne jako polecenie w dowolnej sesji PowerShell. Każdy skrypt jest pobierany bezpośrednio z GitHub w chwili uruchomienia, więc zawsze masz aktualną wersję, a lokalny cache działa jako rezerwa offline. Wszystkie 18 narzędzi ma własne polecenie i krótki alias, więc wpisanie urt uruchamia Universal Rename Tool.
          requirements: PowerShell 5.1 & 7 · Dostęp do internetu potrzebny do pobrania aktualnego skryptu (kopie z cache działają offline)
