  privacy:
    heading: Polityka prywatności
    lastUpdated: 'Ostatnia aktualizacja: 4 kwietnia 2026'
    overviewHeading: Przegląd
    overviewIntro: Killer Tools
    overviewBody: to darmowy zestaw narzędzi IT. Twoja prywatność jest dla nas ważna, a niniejsza polityka wyjaśnia, jak przetwarzamy Twoje dane.
    dataCollectionHeading: Zbieranie danych
    dataCollectionBody: Killer Tools nie zbiera, nie przechowuje ani nie przesyła żadnych danych osobowych. Całe przetwarzanie narzędzi odbywa się wyłącznie w Twojej przeglądarce. Żadne dane wprowadzone w narzędziu nie są wysyłane na żaden serwer.
    cookiesHeading: Pliki cookie
    cookiesBody: Ta strona nie używa plików cookie do śledzenia. Twoje preferencje motywu i ustawienia są przechowywane lokalnie w przeglądarce i nigdy nie są przesyłane.
    analyticsHeading: Analityka
    analyticsIntro: Ta strona używa
    analyticsBody: narzędzia analitycznego dbającego o prywatność, aby zrozumieć ogólne wzorce użytkowania, takie jak wyświetlenia stron i źródła odesłań. Umami nie używa plików cookie, nie śledzi użytkowników między witrynami i nie zbiera żadnych danych umożliwiających identyfikację. Wszystkie dane są zagregowane i anonimowe.
    thirdPartyHeading: Usługi stron trzecich
    thirdPartyBody: Niektóre narzędzia mogą prowadzić do zewnętrznych zasobów lub dokumentacji. Nie odpowiadamy za praktyki prywatności tych zewnętrznych witryn.
    androidAppHeading: Aplikacja na Androida
    androidAppBody: Aplikacja Killer Tools na Androida jest nakładką na aplikację internetową. Nie żąda ani nie uzyskuje dostępu do żadnych uprawnień urządzenia poza podstawowym dostępem do internetu. Żadne dane urządzenia nie są zbierane ani przesyłane.
    contactHeading: Kontakt
    contactBody: Jeśli masz pytania dotyczące tej polityki prywatności, możesz się z nami skontaktować pod adresem
  androidApp:
    robotAttribution: Robot Android jest odtworzony lub zmodyfikowany na podstawie pracy stworzonej i udostępnionej przez Google, wykorzystywanej zgodnie z warunkami opisanymi w licencji Creative Commons 3.0 Attribution.
    heading: Killer Tools na Androida
    introBody1: 'Cały zestaw narzędzi killertools.net jako natywna aplikacja na Androida: każde narzędzie, biblioteka Killer Scripts i wszystkie ulubione, jedno stuknięcie od ekranu głównego.'
    introBody2: Te same zasady co na stronie. Wszystko działa na Twoim urządzeniu. Bez konta, bez telemetrii, bez ukrytej komunikacji. Jeśli oszczędzi Ci cykl zgłoszenia w terenie, spełniło swoje zadanie.
    betaStatusPrefix: Aplikacja jest obecnie w
    betaStatusStrong: zamkniętej wersji beta w Google Play
    betaStatusSuffix: ', i tu wchodzisz do gry.'
    joinBetaHeading: Dołącz do bety
    joinBetaIntroPrefix: Google wymaga
    joinBetaIntroStrong: 12 testerów z zainstalowaną aplikacją przez 14 kolejnych dni
    joinBetaIntroSuffix: 'zanim aplikacja niezależnego dewelopera będzie mogła stać się publiczna. Trzy kroki, około dwie minuty, i będziesz jednym z dwunastu:'
    step1LinkText: Dołącz do grupy testerów
    step1Suffix: na Google Groups (kliknij "Join group").
    step2LinkText: Zostań testerem
    step2Suffix: na stronie zapisów Google Play.
    step3LinkText: Zainstaluj aplikację
    step3Suffix: z Google Play i pozostaw ją zainstalowaną przez dwa tygodnie.
    sameAccountStrong: Użyj tego samego konta Google we wszystkich trzech krokach
    sameAccountSuffix: ' - strona zapisów pokaże "niedostępne dla tego konta", jeśli pominiesz grupę lub zmienisz konto.'
    feedbackPrefix: 'Coś nie działa albo czegoś brakuje? Daj mi znać:'
  home:
    sortPopular: Popularne
    sortAZ: A - Z
    sortZA: Z - A
  about:
    heading: O Killer Tools
    intro: Technicy terenowi nie mają czasu na zbędne funkcje. Każde narzędzie tutaj istnieje, ponieważ potrzebowałem go w pracy i nie mogłem znaleźć niczego, co po prostu działało bez konta, instalacji czy telemetrii.
    originPrefix: Obecnie tworzę narzędzia w wewnętrznym zespole inżynierii AI w MSP, po sześciu latach programowania full-stack i ośmiu latach jako technik terenowy w kilku firmach. KillerTools.net zaczęło się jako fork świetnego
    originMid: projektu autorstwa
    originSuffix: i rozwinęło się w coś stworzonego dla rodzaju pracy, którą naprawdę wykonuję. Zbudowałem go, aby sprawdzać ustawienia zasad grupy w trakcie zgłoszenia, skanować podsieć klienta i pobierać informacje o portach bez opuszczania przeglądarki.
    scriptsLibrary: Biblioteka Killer Scripts obejmuje zadania pojawiające się w każdym cyklu zgłoszeń. Każdy skrypt działa w PS 5.1, PS 7 i Kaseya LiveConnect bez żadnych zależności.
    privacyBody: Wszystko działa w Twojej przeglądarce. Nic nie jest śledzone. Konto nigdy nie jest wymagane. Strona egzekwuje rygorystyczną Content Security Policy, aby blokować ataki w łańcuchu zależności. Jeśli skompromitowany pakiet npm trafi kiedyś do paczki, nie będzie mógł wysłać na zewnątrz tego, co wkleiłeś.
    maintainedByPrefix: Stworzone i utrzymywane przez
    maintainedByMid: Jeśli to oszczędza Ci czas w pracy,
    buyMeCoffee: postawienie mi kawy
    maintainedBySuffix: jest mile widziane, ale nigdy nieoczekiwane.
