          description: Przełączaj się między tenantami Microsoft 365 w PowerShell bez ryzyka wysłania poleceń do niewłaściwego. KillerPivot wyłącza auth broker, aby wymusić prawdziwe okno logowania, a następnie sprawdza, do którego tenanta sesja rzeczywiście trafiła, i weryfikuje to, zanim czegokolwiek dotkniesz. Zapisz swoje tenanty raz, a potem przełączaj się między nimi po nazwie, z wbudowaną weryfikacją tożsamości.
