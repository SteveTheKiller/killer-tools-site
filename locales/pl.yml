about:
  content: |
    # killer-tools

    Technicy w terenie nie mają czasu na zbędne dodatki. Każde narzędzie tutaj istnieje, bo potrzebowałem go w pracy i nie mogłem znaleźć niczego, co po prostu działało bez konta, instalacji czy telemetrii.

    Jestem technikiem terenowym w MSP i zajmuję się sieciami, administracją systemów oraz wsparciem stacji końcowych. killer-tools powstał jako fork świetnego projektu [IT-Tools](https://github.com/CorentinTh/it-tools) i wyrósł na coś stworzonego do pracy, którą faktycznie wykonuję. Zbudowałem go, żeby w trakcie zgłoszenia sprawdzać kody NDR, skanować podsieć klienta i dekodować SafeLink, zanim w niego kliknę.

    Wszystko działa w twojej przeglądarce. Nic nie jest śledzone. Konto nie jest wymagane, nigdy.

    Stworzone i utrzymywane przez [Steve the Killer](https://thekiller.net). Jeśli oszczędza ci to czas w pracy, [postawienie mi kawy](https://www.buymeacoffee.com/StevetheKiller) jest mile widziane, ale nigdy nie jest oczekiwane.

    ## Brakuje narzędzia? Znalazłeś błąd?

    Zgłoś prośbę o funkcję lub błąd w [sekcji issues](https://github.com/SteveTheKiller/killer-tools-site/issues/new/choose) na GitHubie. Czytam je.
