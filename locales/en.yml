about:
  content: |
    # killer-tools

    Field techs don't have time for bloat. Every tool here exists because I needed it on the job and couldn't find something that just worked without an account, an install, or telemetry.

    I'm a field tech at an MSP handling networking, sysadmin work, and endpoint support. killer-tools started as a fork of the excellent [IT-Tools](https://github.com/CorentinTh/it-tools) project and grew into something built for the kind of work I actually do. I built it to look up NDR codes mid-ticket, scan a client's subnet, and decode a SafeLink before clicking it.

    Everything runs in your browser. Nothing is tracked. No account is required, ever.

    Built and maintained by [Steve the Killer](https://thekiller.net). If this saves you time on the job, [buying me a coffee](https://www.buymeacoffee.com/StevetheKiller) is appreciated but never expected.

    ## Missing a tool? Found a bug?

    Open a feature request or bug report in the [issues section](https://github.com/SteveTheKiller/killer-tools-site/issues/new/choose) on GitHub. I read them.

