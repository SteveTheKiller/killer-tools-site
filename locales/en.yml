    heading: Privacy Policy
    lastUpdated: 'Last updated: April 4, 2026'
    overviewHeading: Overview
    overviewIntro: Killer Tools
    overviewBody: is a free collection of IT utility tools. Your privacy is important to us, and this policy explains how we handle your data.
    dataCollectionHeading: Data Collection
    dataCollectionBody: Killer Tools does not collect, store, or transmit any personal data. All tool processing happens entirely in your browser. No data you enter into any tool is sent to any server.
    cookiesHeading: Cookies
    cookiesBody: This site does not use cookies for tracking. Your theme preferences and settings are stored locally in your browser and are never transmitted.
    analyticsHeading: Analytics
    analyticsIntro: This site uses
    analyticsBody: a privacy-focused analytics tool, to understand general usage patterns such as page views and referral sources. Umami does not use cookies, does not track users across sites, and does not collect any personally identifiable information. All data is aggregated and anonymous.
    thirdPartyHeading: Third-Party Services
    thirdPartyBody: Some tools may link to external resources or documentation. We are not responsible for the privacy practices of those external sites.
    androidAppHeading: Android App
    androidAppBody: The Killer Tools Android app is a wrapper around the web application. It does not request or access any device permissions beyond basic internet access. No device data is collected or transmitted.
    contactHeading: Contact
    contactBody: If you have questions about this privacy policy, you can reach us at
  androidApp:
    robotAttribution: The Android robot is reproduced or modified from work created and shared by Google and used according to terms described in the Creative Commons 3.0 Attribution License.
    heading: Killer Tools for Android
    introBody1: 'The whole killertools.net toolbox as a native Android app: every tool, the Killer Scripts library, and all your favorites, one tap from your home screen.'
    introBody2: Same rules as the site. Everything runs on your device. No account, no telemetry, no phone-home. If it saves you a ticket cycle in the field, it did its job.
    betaStatusPrefix: The app is currently in
