    sameAccountStrong: Use the same Google account for all three steps
    sameAccountSuffix: ' - the opt-in page says "not available for this account" if you skip the group or switch accounts.'
    feedbackPrefix: 'Something broken or missing? Tell me:'
  home:
    sortPopular: Popular
    sortAZ: A – Z
    sortZA: Z – A
  about:
    heading: About Killer Tools
    intro: Field techs don't have time for bloat. Every tool here exists because I needed it on the job and couldn't find something that just worked without an account, an install, or telemetry.
    originPrefix: I build tools on an MSP's internal AI engineering team now, after six years of full-stack development and eight years as a field technician across several companies. KillerTools.net started as a fork of the excellent
    originMid: project by
    originSuffix: and grew into something built for the kind of work I actually do. I built it to look up Group Policy settings mid-ticket, scan a client's subnet, and pull port references without leaving the browser.
    scriptsLibrary: The Killer Scripts library covers the jobs that come up every ticket cycle. Every script runs in PS 5.1, PS 7, and Kaseya LiveConnect with no dependencies.
    privacyBody: Everything runs in your browser. Nothing is tracked. No account is required, ever. The site enforces a strict Content Security Policy to block dependency-chain attacks. If a compromised npm package ever ends up in the bundle, it can't phone home with what you pasted.
    maintainedByPrefix: Built and maintained by
    maintainedByMid: If this saves you time on the job,
    buyMeCoffee: buying me a coffee
    maintainedBySuffix: is appreciated but never expected.
    missingToolHeading: Missing a tool? Found a bug?
