about:
  content: |
    # killer-tools

    Terenski tehniki nimamo časa za navlako. Vsako orodje tukaj obstaja, ker sem ga potreboval pri delu in nisem našel rešitve, ki bi preprosto delovala brez računa, namestitve ali telemetrije.

    Sem terenski tehnik pri ponudniku upravljanih storitev IT, kjer skrbim za omrežja, sistemsko administracijo in podporo končnim napravam. killer-tools je nastal kot izpeljanka odličnega projekta [IT-Tools](https://github.com/CorentinTh/it-tools) in se razvil v zbirko za delo, ki ga dejansko opravljam. Ustvaril sem ga za iskanje kod NDR med reševanjem zahtevka, pregled strankinega podomrežja in dekodiranje povezave SafeLink pred klikom.

    Vse se izvaja v vašem brskalniku. Nič se ne sledi. Račun ni nikoli potreben.

    Ustvarja in vzdržuje [Steve the Killer](https://thekiller.net). Če vam prihrani čas pri delu, bom hvaležen, če mi [častite kavo](https://www.buymeacoffee.com/StevetheKiller), vendar tega nikoli ne pričakujem.

    ## Pogrešate orodje? Ste našli napako?

    Oddajte predlog funkcije ali prijavo napake v [razdelku težav](https://github.com/SteveTheKiller/killer-tools-site/issues/new/choose) na GitHubu. Berem jih.
