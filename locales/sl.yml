    infer: Agent lahko iz opravila in razpoložljivega konteksta izbere ustrezno orodje KillerTools ali aplikacije Killer. Uporabite {a}, {b}, {c} ali drugo ime aplikacije le, kadar želite izrecno določiti cilj. Podčrtaji, ime operacije ali ukaz s poševnico niso potrebni.
    worker:
      title: Kako deluje Cloudflare Worker
      p1: Javna končna točka je odprtokodni strežnik MCP s pretočnim HTTP, nameščen ločeno od spletnega mesta. Vaš odjemalec MCP pošlje ime orodja in omejene argumente na {url}. Worker preveri zahtevo, zažene izbrano orodje in vrne rezultat.
      p2: Večina izračunov in pretvorb poteka neposredno v Workerju. Poizvedbe DNS uporabljajo Cloudflare DNS prek HTTPS. Poizvedbe o registraciji domen sledijo imeniku IANA RDAP. Iskanja CVE, GIF in katalogov se obrnejo na javne ponudnike ter lahko ne uspejo, kadar ti niso dosegljivi ali omejijo število zahtev.
    examples:
      title: Poskusite vprašati
      intro: Začnite z {killer} in opišite želeni rezultat. Če je opravilo jasno, ime aplikacije ali orodja ni obvezno.
      e1: poišči podatke o domeni thekiller.net
      e2: izračunaj 192.168.10.0/24
      e3: poišči dogodek Windows 4625
      e4: razišči CVE-2025-53770
      e5: razčleni te glave e-pošte
      e6: sestavi ukaz PowerShell za seznam ustavljenih storitev
      e7: pretvori ta JSON v CSV
      e8: primerjaj ta dva dokumenta JSON
      e9: ustvari zapis SPF za example.com
      e10: dekodiraj to besedilo Base64
      e11: prepoznaj ta SKU za M365
      e12: izračunaj 30-sekundno osvetlitev s tem filtrom ND
    apps:
      title: Povezave z aplikacijami Killer
      intro: Ti primeri uporabljajo nameščen KillerMCP in podprto aplikacijo Killer v vašem računalniku Windows. Zahtevo napišite z običajnimi besedami; agent izbere razpoložljivi ukaz.
      killendarNote: Za ustvarjanje sestankov mora biti Killendar odprt in odklenjen.
      shortcut: Vsako od teh zahtev lahko začnete z {killer} namesto z imenom aplikacije. Aplikacijo poimenujte le, ko jo želite izrecno izbrati.
      pdf1: killerpdf združi te datoteke PDF v tem vrstnem redu
      pdf2: killerpdf poišči številko računa v tej datoteki PDF
      pdf3: killer dodaj iskalno plast OCR v to datoteko PDF
      pdf4: killer pretvori to beležko KillerNotes v PDF
      notes1: killernotes poišči moje beležke o pisarniškem omrežju
      notes2: killernotes ustvari beležko s tem povzetkom sestanka
      notes3: killer prikaži moje beležke z oznako projekti
      notes4: killer shrani to poročilo KillerScan kot beležko
      scan1: killerscan prikaži podrobnosti mojega lokalnega omrežja
      scan2: killerscan preišči omrežje 192.168.1.0/24 in poišči naprave
      scan3: killer preveri odziv example.com z ukazom ping in prikaži izgubo paketov
      scan4: killer ustvari poročilo PDF iz tega pregleda omrežja
      shell1: killershell prikaži storitve, ki se izvajajo v tem računalniku
      shell2: killershell v C:\Docs poišči datoteke z imenom invoice
      shell3: killer prikaži najnovejše vnose v dnevniku Application
      shell4: killer shrani ta seznam vsebine mape kot PDF
      calendar1: killendar prikaži moje sestanke za jutri
      calendar2: killendar ustvari sestanek jutri ob 9. uri z naslovom Jutranji sestanek
      calendar3: killer prikaži moj dnevni red za naslednjih sedem dni
      calendar4: killer shrani dnevni red za naslednji teden kot beležko
    twice:
      title: Zakaj se {km} izvaja dvakrat
      body: Claude Desktop vsak lokalni strežnik MCP zažene dvakrat. En primerek je namenjen pogovorom v aplikaciji, drugi pa sejam Claude, ki ta računalnik uporabljajo na daljavo. Dva procesa KillerMCP.exe pod aplikacijo Claude v Upravitelju opravil sta običajna. KillerMCP ni nameščen dvakrat in ničesar ni treba popravljati.
    can:
      title: Kaj omogoča?
      intro: "Vprašajte z običajnimi besedami. Agent odkrije razpoložljiva orodja in njihove vhodne podatke, nato pokliče potrebna. Lahko na primer:"
      i1: Izračuna podomrežja IPv4, razširi obsege naslovov, ustvari predpone IPv6 ULA in poišče proizvajalce po naslovu MAC.
      i2: Preveri zapise DNS in registracijo domen, poišče ranljivosti CVE ter prepozna vrata in protokole.
      i3: Razčleni glave e-pošte, ustvari zapise SPF ali DMARC in poišče obvestila NDR Exchange.
      i4: Poišče ID-je napak in dogodkov Windows, nastavitve pravilnikov skupine in licence SKU za M365.
      i5: Poišče ukaze cmdlet PowerShell in sestavi ukaze, ki jih pred izvajanjem pregledate.
      i6: Oblikuje JSON in XML, pretvarja JSON v CSV ali med zapisi JSON, YAML in TOML, dekodira Base64, primerja dokumente in preizkuša regularne izraze.
      i7: Ustvari kode QR, identifikatorje UUID, metaoznake in nadomestno vsebino ali izvede izračune za fotografsko osvetlitev in film.
      i8: Pretvarja velikost črk, datume, čase, temperature, barve, številske osnove, rimska števila, dvojiško besedilo, črkovanje NATO in zapise telefonskih številk.
      i9: Oblikuje SQL, YAML, TOML, Markdown, entitete HTML in strukturirane podatke ali izračuna odstotke, urnike cron in vrednosti chmod.
      i10: Poišče čustvenčke, GIF-e, KillerScripts in module Killer ali pregleda URL-je, uporabniške agente, kode stanja HTTP in statistiko besedila.
    cov:
      title: Kaj omogoča posamezna povezava?
      hostedTitle: Strežnik Cloudflare
      hostedBody: 64 orodij, primernih za spletno uporabo, s 74 operacijami. Deluje oddaljeno prek HTTP brez namestitve. Nima dostopa do lokalnih aplikacij ali datotek.
      installedTitle: Namestitev za Windows
      installedBody: Vseh 81 orodij KillerTools s 94 operacijami ter ukazi podprtih nameščenih aplikacij Killer. Deluje kot lokalna povezava MCP.
      browserTitle: Spremljevalne strani v brskalniku
      browserBody: Orodja za kamero, napravo, urejanje in podpis odprejo zasebno stran na localhost.
    data:
      title: Kam gredo podatki?
      p1: Nameščeno izvajalno okolje KillerMCP deluje v vašem računalniku. Nekatere omrežne in referenčne poizvedbe še vedno uporabljajo javne vire podatkov. Agent prejme vhodne podatke in rezultate, potrebne za izvedbo zahteve.
      p2: Izbirna gostovana povezava pošilja vhodne podatke orodij v KillerTools Cloudflare Worker. Ne zahteva prijave, omejuje telesa zahtev na 64 KiB, uporablja omejene sheme in omejuje število zahtev za vsak povezani naslov IP. Prek gostovane povezave ne pošiljajte gesel, zasebnih datotek, žetonov ali podatkov strank.
      p3: Orodja za lokalne datoteke, brskalnik, gesla, žetone, šifriranje, zgoščevanje, OTP, BIP39 in ustvarjanje ključev niso na javnem Workerju. Delujejo prek nameščenega KillerMCP, vendar lahko odjemalec MCP in ponudnik modela še vedno prejmeta vhodne podatke in rezultate.
    oss:
      title: Odprta koda in trenutne omejitve
      p1: "{kt} vsebuje javni Worker, lokalni paket KillerTools, preslikavo operacij, sheme preverjanja in preverjanja pokritosti. {km} vsebuje skupnega lokalnega gostitelja, vmesnike za namizne aplikacije, namestitveni program in integracijska preverjanja."
      ktLink: Izvorna koda KillerTools
      kmLink: Izvorna koda KillerMCP
      p2: Rezultati zunanjih poizvedb so odvisni od njihovih virov. Lokalna orodja prejmejo samo poti ali vrednosti, podane v klicu orodja. Dekodiranje datoteke Base64 ustvari novo datoteko in zavrne prepis obstoječe. Zajem s kamero še vedno zahteva ročno dovoljenje brskalnika in preverjanje strojne opreme. Trenutni namestitveni program KillerMCP je podpisan, časovno žigosan in objavljen prek GitHub Releases.
