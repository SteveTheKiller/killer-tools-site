    heading: Pravilnik o zasebnosti
    lastUpdated: "Nazadnje posodobljeno: 4. aprila 2026"
    overviewHeading: Pregled
    overviewIntro: Killer Tools
    overviewBody: je brezplačna zbirka orodij za IT. Vaša zasebnost nam je pomembna, ta pravilnik pa pojasnjuje, kako ravnamo z vašimi podatki.
    dataCollectionHeading: Zbiranje podatkov
    dataCollectionBody: Killer Tools ne zbira, shranjuje ali prenaša osebnih podatkov. Vsa obdelava orodij poteka v celoti v vašem brskalniku. Nobeni podatki, ki jih vnesete v orodja, niso poslani strežniku.
    cookiesHeading: Piškotki
    cookiesBody: To spletno mesto ne uporablja sledilnih piškotkov. Vaše nastavitve teme in druge nastavitve so shranjene lokalno v brskalniku in se nikoli ne prenašajo.
    analyticsHeading: Analitika
    analyticsIntro: To spletno mesto uporablja
    analyticsBody: analitično orodje, osredotočeno na zasebnost, za razumevanje splošnih vzorcev uporabe, kot so ogledi strani in viri obiskov. Umami ne uporablja piškotkov, uporabnikom ne sledi med spletnimi mesti in ne zbira podatkov, ki bi omogočali osebno prepoznavo. Vsi podatki so združeni in anonimni.
    thirdPartyHeading: Storitve drugih ponudnikov
    thirdPartyBody: Nekatera orodja lahko vsebujejo povezave do zunanjih virov ali dokumentacije. Za ravnanje teh zunanjih mest z zasebnostjo ne odgovarjamo.
    androidAppHeading: Aplikacija za Android
    androidAppBody: Aplikacija Killer Tools za Android je ovoj spletne aplikacije. Ne zahteva ali uporablja dovoljenj naprave razen osnovnega dostopa do interneta. Podatki o napravi se ne zbirajo ali prenašajo.
    contactHeading: Stik
    contactBody: Če imate vprašanja o tem pravilniku o zasebnosti, nam pišite na
  androidApp:
    heroAlt: Killer Tools za Android, orodja IT za terenske tehnike
    robotAttribution: Robot Android je reproduciran ali prilagojen iz dela, ki ga je ustvaril in delil Google, ter uporabljen skladno s pogoji licence Creative Commons 3.0 Priznanje avtorstva.
    heading: Killer Tools za Android
    introBody1: "Celotna zbirka killertools.net kot izvorna aplikacija za Android: vsa orodja, knjižnica Killer Scripts in vse vaše priljubljene vsebine, en dotik od začetnega zaslona."
    introBody2: Enaka pravila kot na spletnem mestu. Vse deluje v vaši napravi. Brez računa, telemetrije ali poročanja strežniku. Če vam na terenu prihrani en servisni postopek, je opravila svoje delo.
    betaStatusPrefix: Aplikacija je trenutno v fazi
    betaStatusStrong: zaprtega beta preizkusa v Googlu Play
    betaStatusSuffix: ", in tu potrebujemo vas."
    joinBetaHeading: Pridružite se beta preizkusu
    joinBetaIntroPrefix: Google zahteva
    joinBetaIntroStrong: 12 preizkuševalcev z aplikacijo, nameščeno 14 zaporednih dni
    joinBetaIntroSuffix: "preden lahko neodvisni razvijalec javno objavi aplikacijo. Trije koraki, približno dve minuti in postanete eden od dvanajstih:"
    step1LinkText: Pridružite se skupini preizkuševalcev
    step1Suffix: v Google Groups (kliknite "Join group").
    step2LinkText: Postanite preizkuševalec
    step2Suffix: na prijavni strani Google Play.
    step3LinkText: Namestite aplikacijo
    step3Suffix: iz Googla Play in jo pustite nameščeno dva tedna.
