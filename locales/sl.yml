  killer-modules:
    title: Killer Modules
    description: Moduli PowerShell za skrbništvo sistema Windows in terensko delo ponudnikov upravljanih storitev. Namestite jih iz galerije PowerShell.
    ui:
      repo: Repozitorij
      commands: Ukazi
      requires: Zahteva
      copyInstall: Kopiraj namestitveni ukaz
      copied: Kopirano!
      modules:
        KillerPivot:
          description: Preklapljajte med najemniki Microsoft 365 v PowerShellu, ne da bi ukaze izvedli pri napačnem. KillerPivot onemogoči posrednika za preverjanje pristnosti, da zahteva pravo prijavno okno, nato v seji preveri dejanskega najemnika, preden kar koli spremenite. Najemnike shranite enkrat, nato med njimi preklapljajte po imenu z vgrajenim preverjanjem identitete.
          requirements: PowerShell 5.1 in 7 · ExchangeOnlineManagement v3+ · Microsoft.Graph.Authentication (za -Graph)
        KillerScripts:
          description: Vsa orodja iz repozitorija killer-scripts so na voljo kot ukazi v kateri koli seji PowerShell. Vsak skript se ob zagonu znova prenese z GitHuba, zato vedno uporabljate trenutno različico, lokalni predpomnilnik pa omogoča delo brez povezave. Vsako od 18 orodij dobi lasten ukaz in kratek vzdevek, zato vnos urt zažene Universal Rename Tool.
          requirements: PowerShell 5.1 in 7 · Dostop do interneta za pridobitev trenutnega skripta (predpomnjene kopije delujejo brez povezave)
  killer-notes:
    title: KillerNotes
    description: Šifrirana beležnica za tehnike. Obogateno besedilo, vstavljene slike, prave tabele, takojšnje iskanje, SQLCipher AES-256 in deljenje datotek .knote.
  killendar:
    title: The Killendar
    description: Šifriran namizni koledar za Windows. Mesečni, tedenski in dnevni pogled ter dnevni red, barvne kategorije, uvoz in izvoz iCalendar ter sestanki, shranjeni v eni datoteki na vašem računalniku. Brez računa, sinhronizacije ali telemetrije.
