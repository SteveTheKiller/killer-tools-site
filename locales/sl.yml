  about:
    heading: O zbirki Killer Tools
    intro: Terenski tehniki nimamo časa za odvečno navlako. Vsako orodje tukaj obstaja, ker sem ga potreboval pri delu in nisem našel rešitve, ki bi preprosto delovala brez računa, namestitve ali telemetrije.
    originPrefix: Po šestih letih razvoja celotnih spletnih rešitev in osmih letih terenskega dela v več podjetjih zdaj razvijam orodja v interni ekipi za umetno inteligenco pri ponudniku upravljanih storitev. KillerTools.net je nastal kot izpeljanka odličnega
    originMid: projekta avtorja
    originSuffix: in zrasel v nekaj, prilagojeno mojemu dejanskemu delu. Ustvaril sem ga za iskanje nastavitev pravilnikov skupine med reševanjem zahtevka, pregled strankinega podomrežja in iskanje podatkov o vratih, ne da bi zapustil brskalnik.
    scriptsLibrary: Knjižnica Killer Scripts pokriva opravila, ki se ponavljajo pri servisnih zahtevkih. Vsak skript deluje v PS 5.1, PS 7 in Kaseya LiveConnect brez odvisnosti.
    privacyBody: Vse deluje v vašem brskalniku. Ni sledenja. Račun nikoli ni potreben. Spletno mesto uveljavlja strog pravilnik Content Security Policy za preprečevanje napadov prek verige odvisnosti. Če bi se v paketu znašel ogrožen paket npm, prilepljenih podatkov ne bi mogel poslati napadalcu.
