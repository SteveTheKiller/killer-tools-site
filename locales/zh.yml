  about:
    heading: 关于 Killer Tools
    intro: 现场技术人员没有时间浪费在冗余功能上。这里的每个工具都源于我在工作中确实需要它，却找不到无需账号、安装或遥测就能直接使用的方案。
    originPrefix: 我现在在一家 MSP 的内部 AI 工程团队构建工具，此前有六年全栈开发经验和八年在多家公司担任现场技术人员的经历。KillerTools.net 最初是优秀的
    originMid: 项目的一个分支，作者是
    originSuffix: ，后来发展成专为我实际所做的工作而打造的产品。我做它是为了在处理工单时查阅组策略设置、扫描客户子网，以及在不离开浏览器的情况下查询端口参考。
    scriptsLibrary: Killer Scripts 脚本库涵盖了每个工单周期都会遇到的任务。每个脚本都可在 PS 5.1、PS 7 和 Kaseya LiveConnect 中运行，无需任何依赖。
    privacyBody: 一切都在您的浏览器中运行。不进行任何跟踪。永远不需要账号。网站强制执行严格的内容安全策略（CSP），以阻止依赖链攻击。即使某个被篡改的 npm 包混入了构建包，它也无法把您粘贴的内容传回外部。
