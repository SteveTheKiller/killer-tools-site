    heading: 隐私政策
    lastUpdated: 最后更新：2026年4月4日
    overviewHeading: 概述
    overviewIntro: Killer Tools
    overviewBody: 是一套免费的IT实用工具集合。您的隐私对我们很重要，本政策说明我们如何处理您的数据。
    dataCollectionHeading: 数据收集
    dataCollectionBody: Killer Tools 不会收集、存储或传输任何个人数据。所有工具处理都完全在您的浏览器中进行。您在任何工具中输入的数据都不会发送到任何服务器。
    cookiesHeading: Cookie
    cookiesBody: 本网站不使用 Cookie 进行跟踪。您的主题偏好和设置存储在浏览器本地，且从不传输。
    analyticsHeading: 统计分析
    analyticsIntro: 本网站使用
    analyticsBody: 一款注重隐私的分析工具，用于了解页面浏览量和引荐来源等总体使用趋势。Umami 不使用 Cookie，不跨网站跟踪用户，也不收集任何可识别个人身份的信息。所有数据都是汇总且匿名的。
    thirdPartyHeading: 第三方服务
    thirdPartyBody: 部分工具可能链接到外部资源或文档。对于这些外部网站的隐私做法，我们不承担责任。
    androidAppHeading: Android 应用
    androidAppBody: Killer Tools 的 Android 应用是网页应用的封装版本。除基本的网络访问权限外，它不会请求或使用任何设备权限。不会收集或传输任何设备数据。
    contactHeading: 联系方式
    contactBody: 如果您对本隐私政策有任何疑问，可通过以下方式联系我们：
  androidApp:
    robotAttribution: Android 机器人图案改编或复制自 Google 创作并分享的作品，依照知识共享 3.0 署名许可协议的条款使用。
    heading: Android 版 Killer Tools
    introBody1: killertools.net 的完整工具箱现已推出原生 Android 应用：每个工具、Killer Scripts 脚本库以及您所有的收藏，主屏幕轻点即可打开。
    introBody2: 规则与网站相同。一切都在您的设备上运行。无需账号，无遥测，不联网回传。如果它能在现场为您省下一个工单周期，那它就完成了使命。
    betaStatusPrefix: 该应用目前处于
    betaStatusStrong: Google Play 上的封闭测试阶段
    betaStatusSuffix: ，而这正是需要您参与的地方。
    joinBetaHeading: 加入测试
    joinBetaIntroPrefix: Google 要求
    joinBetaIntroStrong: 12 名测试者连续安装该应用 14 天
    joinBetaIntroSuffix: ，独立开发者的应用才能公开发布。三个步骤，大约两分钟，您就能成为这十二人之一：
    step1LinkText: 加入测试组
    step1Suffix: 在 Google Groups 上（点击“Join group”）。
    step2LinkText: 成为测试者
    step2Suffix: 在 Google Play 的加入页面上。
    step3LinkText: 安装应用
    step3Suffix: 从 Google Play 安装，并保持安装状态两周。
    sameAccountStrong: 三个步骤都使用同一个 Google 账号
