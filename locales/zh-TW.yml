  privacy:
    heading: 隱私政策
    lastUpdated: 最後更新：2026年4月4日
    overviewHeading: 總覽
    overviewIntro: Killer Tools
    overviewBody: 是一套免費的IT實用工具集合。您的隱私對我們很重要，本政策說明我們如何處理您的資料。
    dataCollectionHeading: 資料收集
    dataCollectionBody: Killer Tools 不會收集、儲存或傳輸任何個人資料。所有工具處理都完全在您的瀏覽器中進行。您在任何工具中輸入的資料都不會傳送到任何伺服器。
    cookiesHeading: Cookie
    cookiesBody: 本網站不使用 Cookie 進行追蹤。您的主題偏好與設定儲存在瀏覽器本機，且從不傳輸。
    analyticsHeading: 分析統計
    analyticsIntro: 本網站使用
    analyticsBody: 一款注重隱私的分析工具，用於了解頁面瀏覽量與參照來源等整體使用趨勢。Umami 不使用 Cookie，不會跨網站追蹤使用者，也不收集任何可識別個人身分的資訊。所有資料皆為彙總且匿名。
    thirdPartyHeading: 第三方服務
    thirdPartyBody: 部分工具可能連結到外部資源或文件。對於這些外部網站的隱私做法，我們不承擔責任。
    androidAppHeading: Android 應用程式
    androidAppBody: Killer Tools 的 Android 應用程式是網頁應用程式的封裝版本。除基本的網路存取權限外，它不會要求或使用任何裝置權限。不會收集或傳輸任何裝置資料。
    contactHeading: 聯絡方式
    contactBody: 如果您對本隱私政策有任何疑問，可透過以下方式與我們聯絡：
  androidApp:
    robotAttribution: Android 機器人圖案改編或重製自 Google 創作並分享的作品，依照 Creative Commons 3.0 姓名標示授權條款使用。
    heading: Android 版 Killer Tools
    introBody1: killertools.net 的完整工具箱現已推出原生 Android 應用程式：每個工具、Killer Scripts 指令碼庫，以及您所有的收藏，主畫面輕點即可開啟。
    introBody2: 規則與網站相同。一切都在您的裝置上執行。無需帳號、無遙測、不回傳資料。如果它能在現場為您省下一個工單週期，那它就完成了使命。
    betaStatusPrefix: 該應用程式目前處於
    betaStatusStrong: Google Play 上的封閉測試階段
    betaStatusSuffix: ，而這正是需要您參與的地方。
    joinBetaHeading: 加入測試
    joinBetaIntroPrefix: Google 要求
    joinBetaIntroStrong: 12 名測試者連續安裝該應用程式 14 天
    joinBetaIntroSuffix: ，獨立開發者的應用程式才能公開發布。三個步驟，大約兩分鐘，您就能成為這十二人之一：
    step1LinkText: 加入測試群組
    step1Suffix: 在 Google Groups 上（點選「Join group」）。
    step2LinkText: 成為測試者
    step2Suffix: 在 Google Play 的加入頁面上。
    step3LinkText: 安裝應用程式
    step3Suffix: 從 Google Play 安裝，並保持安裝狀態兩週。
    sameAccountStrong: 三個步驟都使用同一個 Google 帳號
    sameAccountSuffix: ' ，如果您跳過群組或更換帳號，加入頁面會顯示「該帳號無法使用」。'
    feedbackPrefix: 有東西壞了或缺少什麼？告訴我：
  home:
    sortPopular: 熱門
    sortAZ: A - Z
    sortZA: Z - A
  about:
    heading: 關於 Killer Tools
    intro: 現場技術人員沒有時間浪費在冗餘功能上。這裡的每個工具都源於我在工作中確實需要它，卻找不到無需帳號、安裝或遙測就能直接使用的方案。
    originPrefix: 我現在在一家 MSP 的內部 AI 工程團隊打造工具，先前有六年全端開發經驗和八年在多家公司擔任現場技術人員的經歷。KillerTools.net 最初只是優秀的
    originMid: 專案的一個分支，作者是
    originSuffix: ，後來發展成專為我實際所做的工作而打造的產品。我做它是為了在處理工單時查閱群組原則設定、掃描客戶子網路，以及在不離開瀏覽器的情況下查詢連接埠參考資料。
    scriptsLibrary: Killer Scripts 指令碼庫涵蓋了每個工單週期都會遇到的任務。每個指令碼都可在 PS 5.1、PS 7 和 Kaseya LiveConnect 中執行，無需任何相依套件。
    privacyBody: 一切都在您的瀏覽器中執行。不會進行任何追蹤。永遠不需要帳號。網站強制執行嚴格的內容安全政策（CSP），以阻止相依鏈攻擊。即使某個遭竄改的 npm 套件混入了建置包，它也無法把您貼上的內容傳回外部。
    maintainedByPrefix: 打造與維護者：
    maintainedByMid: 如果這為您節省了工作時間，
    buyMeCoffee: 請我喝杯咖啡
    maintainedBySuffix: 會讓人感激，但從不強求。
