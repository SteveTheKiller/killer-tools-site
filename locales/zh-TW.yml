about:
  content: |
    # killer-tools

    現場技術人員沒時間處理多餘的東西。這裡的每個工具之所以存在，都是因為我在工作上需要它，卻找不到不用帳號、不用安裝、也沒有遙測就能直接用的東西。

    我是一家 MSP 的現場技術人員，負責網路、系統管理和端點支援。killer-tools 最初是優秀的 [IT-Tools](https://github.com/CorentinTh/it-tools) 專案的分支，後來發展成專為我實際工作而打造的工具。我做它是為了在處理工單時查詢 NDR 代碼、掃描客戶的子網路，以及在點擊之前解碼 SafeLink。

    一切都在你的瀏覽器中執行。不追蹤任何東西。永遠不需要帳號。

    由 [Steve the Killer](https://thekiller.net) 打造與維護。如果它幫你在工作上省下時間，[請我喝杯咖啡](https://www.buymeacoffee.com/StevetheKiller)我會很感謝，但絕不強求。

    ## 缺少某個工具？發現錯誤？

    請到 GitHub 的 [issues 區](https://github.com/SteveTheKiller/killer-tools-site/issues/new/choose)提出功能請求或錯誤回報。我都會看。
