  privacy:
    heading: Політика конфіденційності
    lastUpdated: 'Востаннє оновлено: 4 квітня 2026 р.'
    overviewHeading: Огляд
    overviewIntro: Killer Tools
    overviewBody: '- це безкоштовний набір ІТ-утиліт. Ваша конфіденційність важлива для нас, і ця політика пояснює, як ми обробляємо ваші дані.'
    dataCollectionHeading: Збір даних
    dataCollectionBody: Killer Tools не збирає, не зберігає і не передає жодних персональних даних. Уся обробка відбувається повністю у вашому браузері. Дані, введені в будь-який інструмент, не надсилаються на жоден сервер.
    cookiesHeading: Файли cookie
    cookiesBody: Цей сайт не використовує файли cookie для відстеження. Ваші налаштування теми та параметри зберігаються локально у браузері і ніколи не передаються.
    analyticsHeading: Аналітика
    analyticsIntro: Цей сайт використовує
    analyticsBody: орієнтований на конфіденційність інструмент аналітики, щоб розуміти загальні тенденції використання, як-от перегляди сторінок і джерела переходів. Umami не використовує файли cookie, не відстежує користувачів на різних сайтах і не збирає жодної інформації, що дозволяє встановити особу. Усі дані агреговані та анонімні.
    thirdPartyHeading: Сторонні сервіси
    thirdPartyBody: Деякі інструменти можуть посилатися на зовнішні ресурси чи документацію. Ми не несемо відповідальності за політику конфіденційності цих зовнішніх сайтів.
    androidAppHeading: Застосунок для Android
    androidAppBody: Застосунок Killer Tools для Android є оболонкою веб-застосунку. Він не запитує і не використовує жодних дозволів пристрою, окрім базового доступу до інтернету. Жодні дані пристрою не збираються і не передаються.
    contactHeading: Контакти
    contactBody: Якщо у вас є запитання щодо цієї політики конфіденційності, ви можете звернутися до нас за адресою
  androidApp:
    robotAttribution: Робот Android відтворений або змінений на основі роботи, створеної й опублікованої Google, і використовується згідно з умовами ліцензії Creative Commons 3.0 Attribution.
    heading: Killer Tools для Android
    introBody1: 'Увесь набір інструментів killertools.net у вигляді нативного застосунку для Android: кожен інструмент, бібліотека Killer Scripts і всі обрані - одним дотиком з головного екрана.'
    introBody2: Ті самі правила, що й на сайті. Усе виконується на вашому пристрої. Жодного акаунта, жодної телеметрії, жодного зв'язку з домом. Якщо це заощаджує вам цикл заявки в полі, він виконав своє завдання.
    betaStatusPrefix: Наразі застосунок перебуває в
    betaStatusStrong: закритому бета-тестуванні в Google Play
    betaStatusSuffix: ', і тут потрібна ваша допомога.'
    joinBetaHeading: Приєднатися до бети
    joinBetaIntroPrefix: Google вимагає
    joinBetaIntroStrong: 12 тестувальників із встановленим застосунком протягом 14 днів поспіль
    joinBetaIntroSuffix: 'перш ніж застосунок незалежного розробника зможе стати публічним. Три кроки, близько двох хвилин, і ви - один із дванадцяти:'
    step1LinkText: Приєднатися до групи тестувальників
    step1Suffix: у Google Groups (натисніть «Join group»).
    step2LinkText: Стати тестувальником
    step2Suffix: на сторінці підключення Google Play.
    step3LinkText: Встановити застосунок
    step3Suffix: з Google Play і залишити його встановленим на два тижні.
    sameAccountStrong: Використовуйте той самий обліковий запис Google для всіх трьох кроків
    sameAccountSuffix: ' - сторінка підключення покаже «недоступно для цього облікового запису», якщо ви пропустите групу або зміните обліковий запис.'
    feedbackPrefix: 'Щось зламано або відсутнє? Напишіть мені:'
  home:
    sortPopular: Популярні
    sortAZ: А - Я
    sortZA: Я - А
  about:
    heading: Про Killer Tools
    intro: У виїзних техніків немає часу на зайве. Кожен інструмент тут існує, бо він був потрібен мені на роботі, а готового рішення без акаунта, встановлення чи телеметрії я не знайшов.
    originPrefix: Зараз я розробляю інструменти у внутрішній команді ІІ-інжинірингу MSP, після шести років full-stack розробки і восьми років роботи виїзним техніком у кількох компаніях. KillerTools.net почався як форк чудового
    originMid: проєкту від
    originSuffix: і перетворився на щось створене саме для тієї роботи, якою я насправді займаюся. Я створив його, щоб переглядати налаштування групової політики просто під час заявки, сканувати підмережу клієнта і шукати довідник портів, не покидаючи браузер.
    scriptsLibrary: Бібліотека Killer Scripts охоплює завдання, які трапляються в кожному циклі заявок. Кожен скрипт працює в PS 5.1, PS 7 і Kaseya LiveConnect без жодних залежностей.
    privacyBody: Усе працює у вашому браузері. Ніщо не відстежується. Обліковий запис не потрібен ніколи. Сайт застосовує сувору Політику безпеки вмісту (CSP), яка блокує атаки через ланцюжок залежностей. Якщо скомпрометований npm-пакет колись потрапить у збірку, він не зможе надіслати додому те, що ви вставили.
    maintainedByPrefix: Створено та підтримується
    maintainedByMid: Якщо це заощаджує вам час на роботі,
    buyMeCoffee: почастувати мене кавою
    maintainedBySuffix: буде приємно, але ніколи не очікується.
    missingToolHeading: Бракує інструмента? Знайшли баг?
