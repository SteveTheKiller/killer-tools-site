      infoDownloadSuffix: на ваш комп'ютер для ручного використання.
  powershell-builder:
    title: Конструктор PowerShell
    description: Оберіть cmdlet, заповніть параметри й скопіюйте готову команду PowerShell.
  safelink-decoder:
    title: Декодер Outlook Safelink
    description: Розгортайте посилання Microsoft Defender SafeLinks, щоб побачити справжню URL-адресу призначення.
  port-protocol-reference:
    title: Довідник портів і протоколів
    description: Поширені мережеві порти й протоколи з примітками щодо безпеки та позначками небезпечних портів.
  email-dns-checker:
    title: Перевірка DNS електронної пошти
    description: Перевіряйте записи MX, SPF, DKIM і DMARC для будь-якого домену. Перевіряє конфігурацію автентифікації пошти й позначає поширені помилки налаштування.
  whois-checker:
    title: Пошук WHOIS
    description: Шукайте дані реєстрації будь-якого домену, включно з реєстратором, датами створення й закінчення терміну дії, серверами імен і статусними позначками.
  killer-pdf:
    title: KillerPDF
    description: PDF редактор з відкритим кодом для Windows. Переглядайте, анотуйте, об'єднуйте, розділяйте, сплощуйте, відкривайте захищені паролем PDF, редагуйте текст, малюйте, виділяйте, підписуйте й друкуйте.
  killer-scan:
    title: KillerScan
    description: Швидкий сканер мережі для польових техніків. Виявлення через ARP і ping, зондування портів, пошук виробника та автоматична класифікація пристроїв.
  killer-shell:
    title: KillerShell
    description: Безкоштовна оболонка для досвідчених користувачів. Файловий менеджер, термінал і текстовий редактор в одному вікні, з однією смугою вкладок і одним набором клавіш.
  killer-modules:
    ui:
      repo: Repo
      commands: Команди
      requires: Потребує
      copyInstall: Копіювати встановлення
      copied: Скопійовано!
      modules:
        KillerPivot:
          description: Перемикайтеся між тенантами Microsoft 365 у PowerShell, не ризикуючи надіслати команди не в той тенант. KillerPivot вимикає auth broker, щоб викликати справжнє вікно входу, потім запитує сесію, у якому тенанті вона насправді опинилася, і перевіряє це перш ніж ви щось торкнетеся. Збережіть свої тенанти один раз, а потім перемикайтеся між ними за назвою із вбудованою перевіркою особи.
          requirements: PowerShell 5.1 & 7 · ExchangeOnlineManagement v3+ · Microsoft.Graph.Authentication (для -Graph)
        KillerScripts:
          description: Усі інструменти з репозиторію killer-scripts доступні як команда в будь-якій сесії PowerShell. Кожен скрипт завантажується напряму з GitHub у момент запуску, тож у вас завжди актуальна версія, а локальний кеш працює як резерв офлайн. Усі 18 інструментів мають власну команду та короткий псевдонім, тож urt запускає Universal Rename Tool.
          requirements: PowerShell 5.1 & 7 · Потрібен доступ до інтернету для отримання поточного скрипту (кешовані копії працюють офлайн)
